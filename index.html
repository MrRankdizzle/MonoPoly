      '<button class="btn btn-primary btn-big" id="backToBoardBtn" style="margin-top:16px">Back to the board</button>' +
    '</div></div>';
}
function mountShowdownDom(){
  const o = UI.overlay;
  if(o.finished) return;
  const round = currentShowdownRound();
  // Only a brand-new round resets first-try/resolved; re-mounting the same round
  // (e.g. back from a Lab review) keeps the student's place and honesty flags.
  if(o.mountedIdx !== o.idx){ o.mountedIdx = o.idx; o.firstTry = true; o.resolved = false; o.wrong = []; }
  if(o.resolved){ LAB.onGoalProgress = null; if(round.kind === 'build'){ LAB.tab = round.tab; renderLab(); } return; }
  if(round.kind === 'build'){
    LAB.tab = round.tab; renderLab(); playSfx('open');
    o.logLenStart = LAB.tabs[round.tab].log.length;
    LAB.onGoalProgress = checkShowdownBuildWin;
  } else {
    LAB.onGoalProgress = null;
  }
}
function checkShowdownBuildWin(){
  const o = UI.overlay; if(!o || o.mode !== 'showdown' || o.resolved) return;
  const round = currentShowdownRound();
  if(round.test(LAB.tabs[round.tab])) showdownRoundResolve();
}
function showdownAnswer(i){
  const o = UI.overlay; if(!o || o.resolved) return;
  const round = currentShowdownRound();
  if(i === round.correct){ showdownRoundResolve(); return; }
  o.firstTry = false; o.wrong.push(i);
  const opts = document.querySelectorAll('#sdOpts .qopt');
  if(opts[i]){ opts[i].disabled = true; opts[i].classList.add('wrong'); }
  playSfx('wrong');
  const fb = $('sdFb');
  if(fb) fb.innerHTML = '<div class="quiz-fb warn">Not quite. Try another answer.</div>' + nudgeHTML(round.review || SHOWDOWN_REVIEW[round.group + ':' + round.kind]);
}
function showdownRoundResolve(){
  const o = UI.overlay; if(!o || o.resolved) return;
  o.resolved = true;
  const round = currentShowdownRound();
  o.results.push({correct:true, firstTry: !!o.firstTry});
  PLAYER.showdownDone[o.order[o.idx]] = true; persist();
  LAB.onGoalProgress = null;
  playSfx('correct');
  document.querySelectorAll('#sdOpts .qopt').forEach((el, k) => { el.disabled = true; if(k === round.correct) el.classList.add('correct'); });
  const fb = $('sdFb'); if(!fb) return;
  fb.innerHTML = showdownCorrectHTML(round);
}
function showdownNext(){
  const o = UI.overlay;
  if(o.idx < SHOWDOWN_ROUNDS.length - 1){ o.idx++; renderApp(); return; }
  showdownFinish();
}
function showdownFinish(){
  const o = UI.overlay;
  const firstTryCount = o.results.filter(r => r.firstTry).length;
  let stars = 1;
  if(firstTryCount >= CFG.SHOWDOWN_STARS_3) stars = 3;
  else if(firstTryCount >= CFG.SHOWDOWN_STARS_2) stars = 2;
  const bonus = CFG.ATP_SHOWDOWN_BASE + CFG.ATP_SHOWDOWN_PER_STAR * stars;
  PLAYER.showdown.attempts++;
  PLAYER.showdown.lastStars = stars;
  PLAYER.showdown.bestStars = Math.max(PLAYER.showdown.bestStars, stars);
  o.newBadge = !PLAYER.showdown.badge;
  PLAYER.showdown.badge = true;
  awardATP(bonus); persist(); playSfx('buy'); celebrate();
  logActivity('Mogul Showdown ' + '★'.repeat(stars) + '☆'.repeat(3-stars) + ' (+' + bonus + ' ATP)');
  o.finished = true; o.finalStars = stars; o.finalBonus = bonus; o.finalFirstTry = firstTryCount;
  renderApp();
}

function cardLabel(o){
  if(o.mode === 'module') return MODULES[o.squareId].title;
  if(o.mode === 'showdown') return 'Mogul Showdown';
  if(o.mode === 'denature') return 'Denaturation Station';
  return 'game';
}
function goReview(){
  const o = UI.overlay; if(!o || !o.review) return;
  const r = o.review;
  UI.returnTo = {overlay:o, label:cardLabel(o)};
  UI.overlay = null; LAB.onGoalProgress = null;
  LAB.tab = r.tab;
  UI.reviewFocus = r.focus;
  LAB.focusRow = r.focus.indexOf('facts:') === 0 ? r.focus.slice(6) : null;
  UI.screen = 'lab';
  renderApp();
}
function applyReviewFocus(){
  const f = UI.reviewFocus; if(!f) return;
  UI.reviewFocus = null; // scroll once; the cheat-sheet row stays highlighted via LAB.focusRow
  const sel = f.charAt(0) === '#' ? f : {shelf:'.panel.shelf', bench:'.panel.bench', challenges:'.panel.challenges', hook:'#factshook', targets:'.standard'}[f];
  let el = sel ? document.querySelector(sel) : document.querySelector('.panel.facts');
  if(!el) return;
  if(sel) el.classList.add('review-focus');
  requestAnimationFrame(() => el.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'center'}));
}
function returnToCard(){
  const r = UI.returnTo; if(!r) return;
  UI.returnTo = null; UI.reviewFocus = null; LAB.focusRow = null;
  UI.popup = null; UI.screen = 'board';
  r.overlay.review = null;
  showCard(r.overlay, 'center');
}

/* ---------- Element Detective ---------- */
function detReason(item){
  const has = e => item.f.some(x => x[0] === e), n = e => (item.f.find(x => x[0] === e) || [0, 0])[1];
  if(has('P')) return 'It has phosphorus (P) and nitrogen (N). Nucleotides carry a phosphate group and a nitrogen base, so this is a nucleic acid building block.';
  if(has('N')) return 'It has nitrogen (N) but no phosphorus. Every amino acid has an amino group (with N), so this is a protein building block.' + (has('S') ? ' The sulfur (S) is a bonus clue: a few amino acids carry S.' : '');
  const C = n('C'), O = n('O');
  if(O / C >= .7) return 'Only C, H, and O, with about one O for every C (' + C + ' C : ' + O + ' O). That 1 : 2 : 1 pattern means carbohydrate.';
  return 'Only C, H, and O, but just ' + O + ' O for ' + C + ' C. Far less oxygen and lots of C–H bonds means lipid.';
}
function renderDetective(){
  const box = $('b4DetBody'); if(!box) return;
  const d = detState(), item = DETECTIVE_FORMULAS[d.order[d.pos]];
  const fb = d.solved
    ? '<div class="quiz-fb good">Case closed: it’s <strong>' + esc(item.name) + '</strong>. ' + esc(detReason(item)) + '</div><button class="btn btn-primary quiz-next" data-b4next="1">Next formula</button>'
    : d.wrong.length ? '<div class="quiz-fb warn">Not quite. Check the clues: is there P? N? How much O compared with C?</div>' : '';
  box.innerHTML = '<p class="b4-note">Classify the formula. Correct on the first try counts toward your score.</p>' +
    '<div class="det-formula" aria-label="Formula">' + item.f.map(x => elChip(x[0], x[1])).join('') + '</div>' +
    '<div class="det-opts">' + B4_ORDER.map(g => {
      const cls = d.solved && g === item.group ? ' correct' : d.wrong.includes(g) ? ' wrong' : '';
      return '<button class="qopt' + cls + '" data-b4det="' + g + '" style="--gc:var(--' + g + ')"' + (d.solved || d.wrong.includes(g) ? ' disabled' : '') + '>' + esc(GROUPS[g].label) + '</button>';
    }).join('') + '</div>' +
    '<div id="detFb">' + fb + '</div>' +
    '<p class="det-score">First-try score: <strong>' + d.correct + '</strong></p>' +
    '<details class="det-rules"><summary>Detective’s rules</summary><ol>' +
      '<li>Has <strong>P</strong> (and N)? → nucleic acid.</li>' +
      '<li>Has <strong>N</strong> but no P? → protein (S is a bonus clue).</li>' +
      '<li>Only C, H, O? Compare O with C. About one O per C → carbohydrate. Far fewer O → lipid.</li>' +
    '</ol></details>';
}
function detAnswer(g){
  const d = detState(), item = DETECTIVE_FORMULAS[d.order[d.pos]];
  if(d.solved) return;
  if(g === item.group){
    const first = !d.wrong.length;
    d.solved = true; if(first) d.correct++;
    playSfx('correct'); renderDetective();
    afterAction({type:'detective', ok:first, group:item.group, correct:d.correct});
  } else {
    d.wrong.push(g); playSfx('wrong'); renderDetective();
  }
}
function detNext(){
  const d = detState();
  d.pos++; d.wrong = []; d.solved = false;
  if(d.pos >= d.order.length){ d.order = shuffled(DETECTIVE_FORMULAS.length); d.pos = 0; }
  renderDetective();
}

/* ---------- energy per gram + food lab ---------- */
function renderEnergy(){
  const box = $('b4EnergyBody'); if(!box) return;
  const S = BIG_FOUR_STATS.groups, max = 9;
  const bars = B4_ORDER.map(g => '<div class="ebar"><span class="ebar-l">' + esc(GROUPS[g].label) + '</span>' +
    (S[g].calPerG ? '<span class="ebar-t"><i style="width:' + (S[g].calPerG / max * 100) + '%;background:var(--' + g + ')"></i></span><b>~' + S[g].calPerG + ' Cal/g</b>' : '<span class="ebar-t na">not used as fuel</span><b></b>') + '</div>').join('');
  const E = B4.energy, foods = BIG_FOUR_STATS.foods;
  let lab = '<p class="b4-note">Pick two foods to compare 10 grams of each.</p><div class="food-opts">' + foods.map((f, i) =>
    '<button class="food' + (E.sel.includes(i) ? ' on' : '') + '" data-b4food="' + i + '" style="--gc:var(--' + f.group + ')"><strong>' + esc(f.name) + '</strong><small>' + esc(f.note) + '</small></button>').join('') + '</div>';
  if(E.sel.length === 2){
    const [a, b] = E.sel.map(i => foods[i]);
    if(E.predicted === null){
      lab += '<p class="quiz-q" style="margin-top:12px">Predict: which has more Calories in 10 g?</p><div class="det-opts">' +
        '<button class="qopt" data-b4pred="0">' + esc(a.name) + '</button><button class="qopt" data-b4pred="1">' + esc(b.name) + '</button><button class="qopt" data-b4pred="2">About the same</button></div>';
    } else {
      const ca = a.calPerG * 10, cb = b.calPerG * 10, answer = Math.abs(ca - cb) < 5 ? 2 : ca > cb ? 0 : 1;
      const right = E.predicted === answer, top = Math.max(ca, cb);
      lab += '<div class="food-result">' + [a, b].map(f => '<div class="ebar"><span class="ebar-l">' + esc(f.name) + '</span><span class="ebar-t"><i style="width:' + (f.calPerG * 10 / top * 100) + '%;background:var(--' + f.group + ')"></i></span><b>' + Math.round(f.calPerG * 10) + ' Cal</b></div>').join('') + '</div>' +
        '<div class="quiz-fb ' + (right ? 'good' : 'warn') + '">' + (right ? 'Good prediction! ' : 'Surprise! ') +
          (answer === 2 ? 'They store about the same energy per gram.' : (answer === 0 ? a.name : b.name) + ' stores more energy per gram.') +
          ' Fats pack about 9 Calories/g because their long tails are loaded with C–H bonds. Carbohydrates and proteins already hold lots of oxygen, so they store about 4.</div>' +
        '<button class="btn quiz-next" data-b4reset="1">Try another pair</button>';
    }
  }
  box.innerHTML = '<div class="ebars">' + bars + '</div>' +
    '<p class="b4-trick"><strong>Why?</strong> Energy is stored in chemical bonds, especially C–H bonds. Lipids have the most C–H bonds and the least oxygen, so they store the most energy per gram. That’s why your body uses fat for long-term storage.</p>' + lab;
}
function energyPick(i){
  const E = B4.energy;
  if(E.sel.includes(i)) E.sel = E.sel.filter(x => x !== i);
  else { E.sel.push(i); if(E.sel.length > 2) E.sel.shift(); }
  E.predicted = null; renderEnergy();
}
function energyPredict(k){
  const E = B4.energy, foods = BIG_FOUR_STATS.foods, [a, b] = E.sel.map(i => foods[i]);
  E.predicted = k;
  const ca = a.calPerG * 10, cb = b.calPerG * 10, answer = Math.abs(ca - cb) < 5 ? 2 : ca > cb ? 0 : 1;
  playSfx(k === answer ? 'correct' : 'wrong');
  renderEnergy();
  afterAction({type:'energy', groups:[a.group, b.group], predictedRight:k === answer});
}

function renderBodyChart(){

      'Proteins and lipids make up most of you: proteins build muscle, enzymes, and more, and lipids store energy and form every membrane. Carbohydrates are mostly burned for fuel, so very little is stored at any time.</div>' : '');

function bodyGuess(g){
  B4.body.guess = g;

  afterAction({type:'body', ok:g === biggest});

function labChallengeCheck(ev){
  const t = LAB.tab, T = LAB.tabs[t], list = CHALLENGES[t];
  if(!PLAYER.labChallenges[t]) PLAYER.labChallenges[t] = [];
  const done = PLAYER.labChallenges[t];

  list.forEach((c,i) => {

  if(!newly.length) return;
  newly.forEach(() => awardATP(CFG.ATP_LAB_CHALLENGE));

      (allDone ? ' That’s every ' + tabLabel(t) + ' challenge!' : '');

    labToastTimer = setTimeout(() => el.classList.remove('show'), 5000);
  }

document.addEventListener('click', e => {
  const t = e.target;

  const startBtn = t.closest('#startBtn');
  if(startBtn){ const inp = $('nameInput'); startGame(inp ? inp.value : ''); return; }
  const cont = t.closest('[data-continue]');
  if(cont){ startGame(cont.dataset.continue); return; }

  const menuBtn = t.closest('#menuBtn');
  if(menuBtn){ openMenu(); return; }
  if(t.closest('#walletChip, #bcWalletBtn')){ openPopup({mode:'atpInfo'}); return; }
  if(t.closest('[data-atplab]')){ goAtpLab(); return; }
  const settingsBtn = t.closest('#settingsBtn');
  if(settingsBtn){ openSettings(); return; }
  const navBtn = t.closest('[data-nav]');
  if(navBtn){
    if(navBtn.dataset.nav === 'board' && UI.returnTo){ returnToCard(); return; }
    UI.overlay = null; UI.popup = null; LAB.onGoalProgress = null; LAB.focusRow = null;
    UI.screen = navBtn.dataset.nav;
    renderApp();
    return;
  }
  const retBtn = t.closest('#returnCardBtn');

  const labTabBtn = t.closest('[data-labtab]');
  if(labTabBtn){ switchLabTab(labTabBtn.dataset.labtab); return; }

  const rollBtn = t.closest('#rollBtn, #diceBtn');

  const showdownBtn = t.closest('#showdownBtn');

  const sqBtn = t.closest('.sq[data-sqid]');
  if(sqBtn && !UI.overlay && !UI.popup && !UI.rolling){
    const idx = parseInt(sqBtn.dataset.idx, 10);
    openSquare(SQUARES[idx], idx);
    return;
  }

  const closeOv = t.closest('#closeOverlayBtn');
  if(closeOv){ closeOverlay(); return; }
  const backBtn = t.closest('#backToBoardBtn');
  if(backBtn){ closeOverlay(); return; }
  const giveUp = t.closest('#giveUpBtn');

  const closePop = t.closest('#closePopupBtn');
  if(closePop){ closePopup(); return; }
  const popact = t.closest('[data-popact]');
  if(popact){
    const a = popact.dataset.popact;
    if(a === 'closePopup') closePopup();
    else if(a === 'menu') openMenu();
    else if(a === 'howto') openHowto();
    else if(a === 'switchPlayer') switchPlayer();
    else if(a === 'confirmReset') openConfirmReset();
    else if(a === 'doReset') doReset();
    else if(a === 'reportCard') openReportCard();
    else if(a === 'toggleSound'){ SOUND_ON = !SOUND_ON; saveSoundPref(SOUND_ON); if(SOUND_ON) ensureAudio(); openSettings(); }
    else if(a === 'atpLab') goAtpLab();
    else if(a === 'toggleBlur'){ BLUR_ON = !BLUR_ON; saveBlurPref(BLUR_ON); openSettings(); }
    else if(a.indexOf('color:') === 0){ PLAYER.color = a.slice(6); persist(); openSettings(); }

  const pick = t.closest('[data-pick]');
  if(pick){ togglePick(pick.dataset.pick); return; }
  const unz = t.closest('[data-unzip]');
  if(unz){ unzipStrands(unz.dataset.unzip); return; }
  const atpBtn = t.closest('[data-atp]');
  if(atpBtn && !atpBtn.disabled){ atpStationAct(atpBtn.dataset.atp); return; }
  const sel = t.closest('[data-sel]') || t.closest('[data-mol]');
  if(sel){
    const T = LAB.tabs[LAB.tab]; const id = sel.dataset.sel || sel.dataset.mol;
    if(T.active !== id){ T.active = id; renderLab(); }
  }
});

function doLabAct(a){

  if(t === 'lipids'){
    if(a === 'breakall') breakAllLipid();
    if(a === 'clear'){ T.glycerol = false; T.slots = [null, null, null]; T.wasTri = false; renderLab(); }
    return;
  }
  if(a === 'new'){ T.active = null; renderLab(); return; }
  if(a === 'breakall'){ breakAllLinear(); return; }
  if(a === 'remove'){ T.mols = T.mols.filter(m => m.id !== T.active); if(T.pick) T.pick = T.pick.filter(id => id !== T.active); if(t === 'nucleic') T.mismatch = null; T.active = T.mols.length ? T.mols[T.mols.length - 1].id : null; renderLab(); return; }
  if(a === 'clear'){ T.mols = []; T.active = null; if(t === 'nucleic'){ T.pick = []; T.mismatch = null; } renderLab(); return; }
  if(a === 'zip'){ zipStrands(); return; }
  if(a === 'comp'){ T.complement = !T.complement; renderLab(); afterAction({type:'comp'}); }
}

/* ---------- init ---------- */
(function init(){
  if(STORE.current && STORE.players[STORE.current]){
    PLAYER = normalizePlayer(STORE.players[STORE.current]);
    UI.screen = 'home';
    saveStore(STORE); // persist the migration immediately, don't wait for the next action
  }
  renderApp();
})();
})();
</script>
