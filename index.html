<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mustang MonoPoly: Build the Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --panel:#ffffff; --ink:#1d2a28; --muted:#566762; --line:#d2dbd6;
  --mat:#1f5a52; --mat-grid:rgba(255,255,255,.07); --mat-ink:#e8f3ef; --mat-muted:#acd0c7;
  --carbs:#e8a33d; --proteins:#d94f6a; --lipids:#c2b12c; --nucleic:#7c5cd6;
  --accent:var(--mat); --on-accent:#fff;
  --good:#23804f; --good-bg:#e1f3e8; --warn:#a4481a; --warn-bg:#fbe9dd;
  --atp:#f2c14e; --atp-ink:#5c3d0a;
  /* School colors, sampled from LC Logo.png — chrome only (header/buttons/nav/board
     frame). The four molecule colors above stay as-is for pieces/board groups. */
  --brand:#233766; --brand-blue:#65a5e3; --on-brand:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a19; --panel:#1a2523; --ink:#e3ebe8; --muted:#9fb2ad; --line:#2d3c39;
    --mat:#16403a; --good:#6fd29d; --good-bg:#183a2a; --warn:#f0a070; --warn-bg:#3d2517;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a19; --panel:#1a2523; --ink:#e3ebe8; --muted:#9fb2ad; --line:#2d3c39;
  --mat:#16403a; --good:#6fd29d; --good-bg:#183a2a; --warn:#f0a070; --warn-bg:#3d2517;
  color-scheme:dark;
}
body[data-tab="carbs"]{--accent:var(--carbs); --on-accent:#1b2422}
body[data-tab="proteins"]{--accent:var(--proteins); --on-accent:#fff}
body[data-tab="lipids"]{--accent:var(--lipids); --on-accent:#1b2422}
body[data-tab="nucleic"]{--accent:var(--nucleic); --on-accent:#fff}
body[data-tab="board"]{--accent:var(--brand); --on-accent:#fff}

*{box-sizing:border-box}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size:16px; line-height:1.5}
svg text{font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
img,svg{max-width:100%}
h1,h2,h3{margin:0}
p{margin:0}
ul{margin:0;padding:0}

.wrap{max-width:1200px; margin:0 auto; padding:22px 18px 48px}
.hidden{display:none !important}
.sr{position:absolute; left:-9999px}

/* ---------- Buttons shared ---------- */
.btn{font-size:.82rem; padding:.42rem .8rem; border-radius:999px; border:1.5px solid var(--line); background:var(--panel); cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn-primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600}
.btn-big{font-size:1rem; padding:.75rem 1.4rem; border-radius:14px; font-weight:700}

/* ================= ONBOARDING ================= */
.onboard{min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px}
.onboard-card{background:var(--panel); border:1.5px solid var(--line); border-radius:22px; padding:32px 28px; max-width:440px; width:100%; text-align:center}
.onboard-card h1{font-size:clamp(1.8rem,6vw,2.4rem); font-weight:800; letter-spacing:-.02em}
.onboard-card p{color:var(--muted); margin-top:10px; font-size:.96rem}
.onboard-card input[type=text]{width:100%; margin-top:20px; padding:.8rem 1rem; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-size:1.05rem}
.onboard-card .btn-primary{width:100%; margin-top:14px}
.player-list{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px}
.player-chip{border:1.5px solid var(--line); background:var(--bg); border-radius:999px; padding:.4rem .9rem; cursor:pointer; font-weight:600; font-size:.88rem}
.player-chip:hover{border-color:var(--accent)}
.onboard-note{margin-top:18px; font-size:.78rem; color:var(--muted)}

/* ================= HEADER ================= */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 18px; margin-bottom:16px}
.brand h1{font-size:clamp(1.6rem,4vw,2.2rem); font-weight:800; letter-spacing:-.02em; line-height:1}
.brand{display:flex; align-items:center; gap:12px}
.brand-logo{height:46px; width:auto; flex:none}
.home-logo{height:100px; width:auto; margin:0 auto 14px; display:block}
.brand p{color:var(--muted); font-size:.85rem; margin-top:3px}
.hdr-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.wallet{display:flex; align-items:center; gap:10px; background:var(--panel); border:1.5px solid var(--atp); border-radius:14px; padding:8px 16px 8px 10px}
.wallet .ic{display:flex}
.wallet .n{font-size:1.5rem; font-weight:800; line-height:1; color:var(--atp-ink)}
:root[data-theme="dark"] .wallet .n,
@media (prefers-color-scheme: dark){.wallet .n{color:var(--atp)}}
.wallet .l{font-size:.72rem; color:var(--muted); line-height:1.15}
.wallet.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.iconbtn{width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:var(--panel); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.05rem}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}

/* ================= BOARD ================= */
/* The board screen fills the viewport under the header so the whole board is
   visible without scrolling at 1366x768 (school Chromebook). The board is a
   6x6 perimeter grid stretched into a wide rectangle; below 700px wide it
   turns into a tall rectangle and the page may scroll. Squares and the
   center are CSS size containers, so their contents scale with the board. */
.wrap.board-wrap{display:flex; flex-direction:column; height:100vh; height:100svh; min-height:560px; padding-bottom:14px}
.wrap.board-wrap .top{margin-bottom:12px}
.board-area{flex:1 1 auto; min-height:0; display:flex; transition:filter .3s ease}
.board{position:relative; flex:1 1 auto; width:100%; min-height:440px; max-height:min(66vw, 820px);
  display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); grid-template-rows:repeat(6,minmax(0,1fr)); gap:5px; padding:10px; border-radius:22px;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 7px),
    radial-gradient(130% 100% at 30% 0%, #8cc0ee 0%, var(--brand-blue) 45%, #3f7fc0 100%);
  box-shadow:0 22px 44px -16px rgba(15,25,50,.55), 0 2px 0 rgba(0,0,0,.12), inset 0 0 0 3px rgba(255,255,255,.35), inset 0 -8px 16px rgba(0,0,0,.18)}
.sq{container-type:size; position:relative; border:0; border-radius:10px; padding:0; margin:0; overflow:hidden; cursor:pointer; color:var(--ink); display:flex; flex-direction:column; text-align:left;
  background:linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 90%, #8a9a96));
  box-shadow:0 2px 0 rgba(0,0,0,.2), 0 4px 8px -3px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .15s ease}
.sq:active{transform:translateY(1px)}
@media (hover:hover){ .sq:hover{transform:translateY(-2px)} }
.sq.tint{background:linear-gradient(180deg, color-mix(in srgb, var(--tint) 22%, var(--panel)), color-mix(in srgb, var(--tint) 38%, var(--panel)))}
.sq.owned{background:linear-gradient(180deg, color-mix(in srgb, var(--gc) 14%, var(--panel)), color-mix(in srgb, var(--gc) 30%, var(--panel)))}
.sq[data-here="true"]{box-shadow:0 0 0 3px var(--pc), 0 0 0 6px rgba(255,255,255,.7), 0 6px 14px -4px rgba(0,0,0,.4); z-index:2}
.sq-band{flex:none; height:max(6px, 12cqh); background:var(--gc); box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.sq-band.enz{background:repeating-linear-gradient(135deg, var(--gc) 0 7px, color-mix(in srgb, var(--gc) 60%, #fff) 7px 11px)}
.sq-inner{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:3px 3px 4px}
.sq-art{flex:none; width:min(66cqw, 50cqh); aspect-ratio:1; display:flex}
.sq-art svg{width:100%; height:100%; display:block}
.sq-name{font-weight:700; line-height:1.08; text-align:center; font-size:9px; font-size:clamp(7.5px, 12cqw, 12px); max-width:100%; min-width:0; hyphens:auto; -webkit-hyphens:auto}
.sq.owned .sq-inner{padding-bottom:max(11px, 15cqh)}
.sq-deed{position:absolute; left:0; right:0; bottom:0; height:max(11px, 15cqh); background:var(--pc); color:#fff; display:flex; align-items:center; justify-content:center; gap:3px;
  font-size:clamp(6.5px, 10cqh, 11px); font-weight:800; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; overflow:hidden; padding:0 6px;
  box-shadow:0 -1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.2)}
.sq-deed span{overflow:hidden; text-overflow:ellipsis}
@container (min-aspect-ratio: 5/4){
  .sq-inner{flex-direction:row; justify-content:flex-start; gap:6%; padding:3px 6px 3px 5px}
  .sq-art{width:auto; height:min(66cqh, 36cqw)}
  .sq-name{text-align:left; font-size:clamp(8px, min(15cqh, 6.8cqw), 15px)}
}
.token{position:absolute; left:0; top:0; z-index:6; pointer-events:none; will-change:transform; filter:drop-shadow(0 5px 3px rgba(0,0,0,.38))}
.token svg{display:block; width:100%; height:100%}

/* ---------- board center ---------- */
.board-center{grid-column:2 / 6; grid-row:2 / 6; container-type:size; position:relative; overflow:hidden; border-radius:16px; color:#fff;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
    radial-gradient(120% 90% at 50% 0%, #34508f 0%, var(--brand) 55%, #16244a 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14), inset 0 12px 30px rgba(0,0,0,.3)}
/* The grid lives on an inner wrapper: a size container can't query itself. */
.bc-grid{position:relative; width:100%; height:100%; display:grid; grid-template-columns:1fr 1.05fr 1fr; grid-template-rows:minmax(0,1fr) auto; grid-template-areas:"decks dice wallet" "ticker ticker ticker";
  gap:3cqh 3cqw; padding:4cqh 3cqw}
.bc-watermark{position:absolute; left:50%; top:46%; height:78%; width:auto; max-width:none; transform:translate(-50%,-50%); opacity:.07; pointer-events:none; filter:grayscale(1) brightness(3)}
.bc-decks{grid-area:decks; display:flex; align-items:center; justify-content:center; gap:7%; position:relative; min-height:0}
.bc-dice{grid-area:dice; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5cqh; position:relative; min-height:0}
.bc-wallet{grid-area:wallet; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2cqh; position:relative; min-height:0; text-align:center}
.bc-ticker{grid-area:ticker; position:relative; display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.28); border-radius:999px; padding:.3rem .9rem; font-size:clamp(11px, 4.2cqh, 15px); min-width:0}
.bc-ticker b{flex:none; color:var(--atp); font-size:.8em; letter-spacing:.08em; text-transform:uppercase}
.bc-ticker span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bc-ticker span.fresh{animation:tickIn .5s ease}
@keyframes tickIn{from{opacity:0; transform:translateY(6px)}}
.bcw-row{display:flex; align-items:center; gap:10px}
.bcw-n{font-size:clamp(22px, 12cqh, 46px); font-weight:800; line-height:1; color:var(--atp); text-shadow:0 2px 0 rgba(0,0,0,.35)}
.bcw-rank{font-size:clamp(10px, 4cqh, 14px); color:rgba(255,255,255,.8); font-weight:600}
.bcw-deeds{font-size:clamp(10px, 3.8cqh, 13px); color:rgba(255,255,255,.7)}
.bc-wallet.bump{animation:bump .5s ease}
.bc-btn{background:rgba(255,255,255,.12); color:#fff; border:1.5px solid rgba(255,255,255,.32); border-radius:12px; padding:.4rem .75rem; font-weight:600; font-size:clamp(10.5px, 3.9cqh, 14px); cursor:pointer; line-height:1.25; max-width:100%}
.bc-btn:hover:not(:disabled){background:rgba(255,255,255,.2)}
.bc-btn:disabled{opacity:.5; cursor:not-allowed}
.bc-btn.gold{background:var(--atp); border-color:var(--atp); color:#1b2422; font-weight:800}
.bc-btn .short{display:none}
.roll-btn{background:linear-gradient(180deg,#ffd46a,var(--atp)); color:#1b2422; border:0; border-radius:14px; padding:.5rem 1.6rem; font-weight:800; font-size:clamp(12px, 5cqh, 18px); letter-spacing:.04em; cursor:pointer; box-shadow:0 4px 0 #a97c14, 0 8px 14px -6px rgba(0,0,0,.5)}
.roll-btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 #a97c14}
.roll-btn:disabled{opacity:.6; cursor:wait}
.dice-note{font-size:clamp(10px, 3.8cqh, 13px); color:rgba(255,255,255,.8); min-height:1.3em; text-align:center}
@container (max-aspect-ratio: 6/5){
  .dback i{display:none}
  .bc-grid{grid-template-columns:1fr 1fr; grid-template-rows:auto minmax(0,1fr) auto; grid-template-areas:"dice dice" "decks wallet" "ticker ticker"; gap:2.5cqh 3cqw; padding:3cqh 3cqw}
  .bcw-rank{display:none}
  .bc-btn .long{display:none}
  .bc-btn .short{display:inline}
  .bc-ticker{font-size:clamp(9px, 3cqh, 13px); padding:.2rem .6rem}
  .bc-ticker b{display:none}
  .dice-note{display:none}
}

/* ---------- decks ---------- */
.deck{--dw:clamp(40px, min(15cqw, 27cqh), 104px); position:relative; width:var(--dw); aspect-ratio:5/7; flex:none}
.deck .dcard{position:absolute; inset:0; border-radius:10%; box-shadow:0 2px 4px rgba(0,0,0,.35)}
.deck .dcard > .dback{height:100%; border-radius:10%}
.deck .dcard:nth-child(1){transform:translate(5%,5%) rotate(4deg)}
.deck .dcard:nth-child(2){transform:translate(2.5%,2.5%) rotate(2deg)}
.deck-lbl{position:absolute; left:50%; top:calc(100% + 6px); transform:translateX(-50%); font-size:clamp(9px, 3.6cqh, 12px); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.8); white-space:nowrap}
.dback{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6%; overflow:hidden; padding:10%}
.dback svg{width:62%; height:auto}
.dback i{font-style:normal; font-weight:800; font-size:clamp(6px, 3cqh, 11px); letter-spacing:.12em}
.dback.prop{background:radial-gradient(circle at 50% 38%, #3a5698, #172649); border:2px solid #f2c14e; color:#f2c14e; box-shadow:inset 0 0 0 3px #172649, inset 0 0 0 4px rgba(242,193,78,.5)}
.dback.enz{background:radial-gradient(circle at 50% 38%, #ffe08a, #e2a52a); border:2px solid #fff4cf; color:#5c3d0a; box-shadow:inset 0 0 0 3px #e2a52a, inset 0 0 0 4px rgba(255,255,255,.6)}

/* ---------- 3D dice ---------- */
.dice-btn{display:flex; gap:clamp(10px, 5cqw, 26px); background:none; border:0; padding:6px; cursor:pointer; border-radius:14px}
.dice-btn:disabled{cursor:wait}
.die-wrap{--ds:clamp(34px, min(17cqh, 10cqw), 76px); display:block; width:var(--ds); height:var(--ds); perspective:calc(var(--ds) * 7); position:relative}
.die-wrap::after{content:""; position:absolute; left:8%; right:8%; bottom:-14%; height:16%; border-radius:50%; background:rgba(0,0,0,.4); filter:blur(3px); z-index:-1}
.die-tilt{display:block; width:100%; height:100%; transform-style:preserve-3d; transform:rotateX(-16deg) rotateY(20deg)}
.die{display:block; width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 1.1s cubic-bezier(.15,.65,.25,1)}
.die .face{position:absolute; inset:0; border-radius:20%; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:15%;
  background:radial-gradient(circle at 30% 25%, #ffffff, #efe9dc 70%, #ddd5c4); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06), inset -2px -3px 6px rgba(0,0,0,.12)}
.die .core{display:block; position:absolute; inset:3%; background:#e2dbcb}
.die .core.cx{transform:rotateX(90deg)}
.die .core.cy{transform:rotateY(90deg)}
.die .f1{transform:translateZ(calc(var(--ds) / 2))}
.die .f6{transform:rotateY(180deg) translateZ(calc(var(--ds) / 2))}
.die .f3{transform:rotateY(90deg) translateZ(calc(var(--ds) / 2))}
.die .f4{transform:rotateY(-90deg) translateZ(calc(var(--ds) / 2))}
.die .f2{transform:rotateX(90deg) translateZ(calc(var(--ds) / 2))}
.die .f5{transform:rotateX(-90deg) translateZ(calc(var(--ds) / 2))}
.pip{place-self:center; width:72%; height:72%; border-radius:50%; background:radial-gradient(circle at 35% 30%, #4a5552, #111a18 70%); box-shadow:inset 0 1px 2px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.7)}
.f1 .pip{background:radial-gradient(circle at 35% 30%, #e0655a, #8e1f18 70%); width:88%; height:88%}
.die-wrap.tossing{animation:toss 1.1s cubic-bezier(.3,.6,.4,1)}
.die-wrap.tossing:nth-child(2){animation-duration:1.02s}
@keyframes toss{0%{transform:none} 25%{transform:translateY(-38%) scale(1.08)} 55%{transform:translateY(0)} 72%{transform:translateY(-12%)} 88%{transform:translateY(0)} 100%{transform:none}}

/* ---------- card stage (property / enzyme / special-square cards) ---------- */
.card-stage{position:fixed; inset:0; z-index:50}
.card-dim{position:absolute; inset:0; background:rgba(10,18,36,.55)}
.card-scroll{position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; display:flex; padding:14px}
.card-main{margin:auto; width:min(1080px, 100%); background:var(--panel); border-radius:20px; padding:7px; transform-origin:50% 50%;
  box-shadow:0 34px 80px -24px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.1)}
.card-main.narrow{width:min(580px, 100%)}
.card-main:focus{outline:none}
.deed{border:2px solid color-mix(in srgb, var(--ink) 70%, transparent); border-radius:14px; overflow:hidden}
body.card-open.fx-blur .board-area{filter:blur(4px) saturate(.8)}
/* While coins fly into the wallet, lift it above the card dim so the student
   sees it count up; clicks pass through so it never blocks the card. */
body.card-open.atp-lift .wallet{position:relative; z-index:60; pointer-events:none}
.deed-band{background:var(--gc); color:var(--gc-ink); padding:12px 16px; display:flex; align-items:center; gap:12px;
  background-image:linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.08)); box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.deed-band > div{min-width:0}
.deed-kicker{font-size:.72rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.85}
.deed-title{font-size:clamp(1.25rem,3.4vw,1.85rem); font-weight:800; line-height:1.1}
.deed-close{margin-left:auto; flex:none; border:2px solid currentColor; background:rgba(255,255,255,.18); color:inherit; border-radius:999px; padding:.4rem .9rem; font-weight:700; font-size:.85rem; cursor:pointer}
.deed-close:hover{background:rgba(255,255,255,.32)}
.deed-body{padding:16px 18px 22px; background:var(--bg)}
.deed-intro{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:start}
.deed-art{width:clamp(84px, 13vw, 128px); aspect-ratio:1; background:var(--panel); border-radius:16px; padding:8px; display:flex; box-shadow:0 0 0 2px color-mix(in srgb, var(--gc) 55%, var(--line)), 0 6px 14px -8px rgba(0,0,0,.4)}
.deed-art svg{width:100%; height:100%}
.deed-sub{font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.deed-intro .lo-hook{margin-top:6px}
.card-center{text-align:center}
.card-center .deed-art{margin:4px auto 10px}
@media (max-width:560px){
  .deed-intro{grid-template-columns:1fr}
  .deed-intro .deed-art{margin:0 auto; width:96px}
  .deed-body{padding:14px 12px 18px}
  .card-scroll{padding:8px}
}
.card-ghost{position:fixed; z-index:55; pointer-events:none; perspective:1000px; transform-origin:50% 50%}
.g-inner{position:relative; width:100%; height:100%; transform-style:preserve-3d}
.g-face{position:absolute; inset:0; border-radius:10%; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
.g-back{transform:rotateY(180deg)}
.g-front{background:#fffdf7; border:2px solid #1b2422; overflow:hidden; display:flex; flex-direction:column; align-items:center}
.g-front .g-band{align-self:stretch; height:18%; background:var(--gc); border-bottom:2px solid #1b2422}
.g-front svg{width:64%; height:auto; margin-top:10%}
.g-front b{font-size:9px; color:#1b2422; text-align:center; padding:4% 6% 0; line-height:1.1}

/* ---------- wrong-answer nudge + Lab return bar ---------- */
.nudge{display:inline-flex; align-items:center; gap:8px; margin-top:10px; background:var(--brand); color:#fff; border:0; border-radius:12px; padding:.6rem 1rem; font-weight:700; font-size:.9rem; cursor:pointer; box-shadow:0 3px 0 #15234a}
.nudge:hover{background:#2d4680}
.nudge:active{transform:translateY(2px); box-shadow:0 1px 0 #15234a}
.return-bar{position:sticky; top:8px; z-index:30; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 14px; background:var(--brand); color:#fff; border-radius:14px; padding:10px 14px; margin:0 0 14px; box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
.return-bar button{background:var(--atp); color:#1b2422; border:0; border-radius:999px; padding:.5rem 1.1rem; font-weight:800; cursor:pointer}
.review-focus{outline:3px solid var(--brand-blue); outline-offset:3px; animation:focusPulse 1.1s ease 3}
.facts dt.review-focus, .facts dd.review-focus{outline:0; background:color-mix(in srgb, var(--brand-blue) 28%, transparent); border-radius:6px; animation:none}
@keyframes focusPulse{50%{outline-color:transparent}}

/* ---------- proficiency levels + standard ---------- */
body[data-tab="bigfour"]{--accent:var(--brand); --on-accent:#fff}
.lvl{display:inline-block; font-size:.68rem; font-weight:800; letter-spacing:.03em; line-height:1.5; padding:0 7px; border-radius:999px; vertical-align:middle; white-space:nowrap}
.lvl1{background:#dff1e6; color:#1d6b42}
.lvl2{background:#e1eafb; color:#2a55a4}
.lvl3{background:#f0e3fb; color:#6c35a3}
.standard{margin-top:16px}
.std-code{font-weight:800}
.std-code span{color:var(--muted); font-weight:600; font-size:.85rem}
.std-text{margin-top:4px; font-size:.95rem}
.std-levels{list-style:none; margin:12px 0 0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:10px 18px; font-size:.9rem}
.std-levels li{display:flex; gap:8px; align-items:flex-start; padding-left:12px; border-left:3px solid var(--line)}
@media (max-width:820px){ .std-levels{grid-template-columns:1fr} }
.toast.show{position:sticky; top:8px; z-index:25; box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.lv-row{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; padding:10px 0; border-top:1px solid var(--line)}
.lv-row:first-of-type{border-top:0}
.lv-row .lvl{font-size:.85rem; padding:2px 10px; margin-top:2px}
.lv-bar{display:block; height:10px; border-radius:999px; background:var(--bg); border:1px solid var(--line); overflow:hidden; margin:6px 0}
.lv-bar i{display:block; height:100%; background:linear-gradient(90deg, var(--brand-blue), var(--brand)); border-radius:999px}
.lv-txt{font-size:.85rem; color:var(--muted)}
.lv-table-wrap{overflow-x:auto; margin-top:10px}
.lv-table{border-collapse:collapse; font-size:.85rem; min-width:100%}
.lv-table th, .lv-table td{padding:6px 10px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap}
.lv-table tbody th{text-align:left}

/* ---------- Meet the Big Four ---------- */
.b4-hero p{max-width:75ch; color:var(--muted)}
.b4-cards{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-top:16px}
.b4-card{background:var(--panel); border:1.5px solid var(--line); border-top:6px solid var(--gc); border-radius:16px; padding:12px 14px}
.b4-head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.b4-head h3{font-size:1.05rem}
.b4-tile{display:flex; width:48px; height:48px; align-items:center; justify-content:center; background:var(--mat); border-radius:12px; flex:none}
.b4-card dl{margin:0; font-size:.85rem}
.b4-card dt{font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:8px}
.b4-card dd{margin:2px 0 0}
.b4-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; align-items:start}
.b4-row + .challenges, .b4-row ~ .challenges{margin-top:16px}
@media (max-width:1020px){ .b4-cards{grid-template-columns:1fr 1fr} }
@media (max-width:820px){ .b4-row{grid-template-columns:1fr} }
@media (max-width:520px){ .b4-cards{grid-template-columns:1fr} }
.el{display:inline-flex; align-items:center; justify-content:center; min-width:1.75em; height:1.75em; padding:0 .3em; margin:1px 2px; border-radius:999px; border:1.5px solid #1b2422; font-weight:800; font-size:.8rem; line-height:1}
.el sub{font-size:.65em; margin-left:1px; vertical-align:-.2em}
.b4-els{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:.9rem}
.b4-els li{display:flex; align-items:center; flex-wrap:wrap; gap:4px}
.b4-els .dot{width:11px; height:11px; border-radius:50%; margin-right:4px}
.b4-els strong{min-width:9.5em}
.b4-trick{margin-top:12px; font-size:.9rem; padding:10px 12px; border-radius:12px; background:color-mix(in srgb, var(--brand-blue) 14%, transparent)}
.b4-note{font-size:.82rem; color:var(--muted); margin-top:6px}
.ratio{margin-top:12px}
.ratio-f{display:flex; flex-wrap:wrap; align-items:center; gap:2px; font-size:.85rem}
.ratio-f span{color:var(--muted); margin-left:6px}
.ratio-bars{display:flex; flex-direction:column; gap:3px; margin-top:6px}
.rb{display:grid; grid-template-columns:1fr 4.5em; gap:8px; align-items:center; font-size:.78rem}
.rb i{display:block; height:10px; border-radius:999px; border:1px solid #1b2422; min-width:4px}
.det-formula{display:flex; flex-wrap:wrap; justify-content:center; gap:4px; padding:16px 10px; margin:10px 0; background:var(--bg); border-radius:14px; font-size:1.35rem}
.det-formula .el{font-size:1.1rem}
.det-opts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.det-opts .qopt{border-left:5px solid var(--gc, var(--line))}
.det-score{margin-top:10px; font-size:.88rem}
.det-rules{margin-top:10px; font-size:.88rem}
.det-rules summary{cursor:pointer; font-weight:700}
.det-rules ol{margin:6px 0 0; padding-left:20px}
.ebars{display:flex; flex-direction:column; gap:6px}
.ebar{display:grid; grid-template-columns:minmax(7em, 34%) 1fr 4.6em; gap:8px; align-items:center; font-size:.85rem}
.ebar-t{display:block; height:16px; background:var(--bg); border-radius:999px; overflow:hidden; border:1px solid var(--line)}
.ebar-t i{display:block; height:100%; border-radius:999px; transition:width .5s ease}
.ebar-t.na{background:none; border:0; height:auto; font-size:.8rem; color:var(--muted); font-style:italic}
.ebar b{text-align:right; font-size:.82rem}
.food-opts{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin-top:8px}
.food{text-align:left; border:1.5px solid var(--line); border-left:5px solid var(--gc); background:var(--panel); border-radius:12px; padding:8px 10px; cursor:pointer; display:flex; flex-direction:column; gap:2px}
.food small{font-size:.75rem; color:var(--muted)}
.food.on{border-color:var(--brand); background:color-mix(in srgb, var(--brand-blue) 16%, var(--panel)); box-shadow:inset 0 0 0 1px var(--brand)}
.food-result{display:flex; flex-direction:column; gap:6px; margin:12px 0 10px}
.body-chart{display:flex; flex-direction:column; gap:6px; margin:12px 0 10px}
.body-chart.hidden-vals .ebar-t i{opacity:.25}
@media (prefers-reduced-motion:reduce){ .ebar-t i{transition:none} }

/* ---------- Phase C: double helix + ATP station ---------- */
.sel.pick[aria-pressed="true"]{background:var(--atp); color:#1b2422; border-color:transparent; font-weight:700}
.duplex{display:grid; grid-template-rows:auto 28px auto; align-items:center; justify-items:center; width:max-content; max-width:100%; overflow-x:auto; padding:2px 0}
.duplex .end{font-weight:800; font-size:.8rem; color:var(--mat-muted)}
.duplex .dx{display:flex; line-height:0}
.hb{display:flex; gap:5px; height:100%; align-items:stretch; justify-content:center}
.hb i{width:0; border-left:2.5px dashed #e8f3ef}
.hb.bad{flex-direction:column; align-items:center; justify-content:center; gap:0; color:#ff8a80; line-height:1}
.hb.bad b{font-size:.9rem}
.hb.bad small{font-size:.62rem; font-weight:700; white-space:nowrap}
.duplex.zipping .hb{transform-origin:50% 50%; animation:zipIn .35s ease backwards; animation-delay:calc(var(--i) * 90ms)}
@keyframes zipIn{from{transform:scaleY(0); opacity:0}}
.helix-view{margin-top:8px; overflow-x:auto}
.helix-view.late{animation:fadeUp .5s ease backwards; animation-delay:calc(var(--n) * 90ms + 250ms)}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px) scaleY(.6)}}
.helix-svg{display:block; max-width:none}
.mol.zipped{cursor:default}
.mismatch-box{border:2px dashed #ff8a80; border-radius:14px; padding:10px 12px; margin-bottom:14px}
.mismatch-box p{font-size:.88rem; margin-bottom:6px}
.atp-station{margin-top:16px}
.atp-stage{position:relative; min-height:0; display:flex; flex-direction:column; align-items:center; padding:12px}
.atp-name{font-weight:800; font-size:1.1rem; color:#ffd79a}
.atp-svg{width:100%; max-width:520px; height:auto}
.atp-eq{margin-top:10px; font-size:.92rem; max-width:80ch}
.free-p{animation:freeP .5s ease}
@keyframes freeP{from{transform:translateX(-30px); opacity:.3}}
.energy-burst{position:absolute; left:72%; top:50%; pointer-events:none}
.energy-burst i{position:absolute; width:10px; height:10px; border-radius:50%; background:radial-gradient(circle, #fff6c2, #ffb52e 60%, transparent 70%); animation:burstE .8s ease-out forwards}
@keyframes burstE{from{transform:translate(0,0) scale(1.4); opacity:1} to{transform:translate(var(--dx), var(--dy)) scale(.3); opacity:0}}
button.wallet{font:inherit; color:inherit; cursor:pointer; text-align:left}
button.wallet:hover{box-shadow:0 0 0 3px color-mix(in srgb, var(--atp) 40%, transparent)}
.bcw-row{background:none; border:0; color:inherit; cursor:pointer; padding:2px 6px; border-radius:12px}
.bcw-row:hover{background:rgba(255,255,255,.08)}
@media (prefers-reduced-motion:reduce){ .duplex.zipping .hb, .helix-view.late, .free-p{animation:none} }

/* ---------- ATP coins + confetti ---------- */
.coin-fly{position:fixed; left:0; top:0; z-index:80; width:26px; height:26px; pointer-events:none; will-change:transform}
.coin-fly svg{display:block}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:90; overflow:hidden}
.confetti i{position:absolute; top:-16px; width:8px; height:13px; border-radius:2px; animation:confettiFall var(--t) cubic-bezier(.25,.55,.45,1) var(--d) forwards}
@keyframes confettiFall{0%{transform:translate(0,0) rotate(0)} 100%{transform:translate(var(--dx), 108vh) rotate(var(--rot))}}

/* ---------- phones: tall board ---------- */
@media (max-width:700px){
  .wrap.board-wrap{height:auto; min-height:0}
  .board-area{display:block}
  .board{aspect-ratio:5/8; min-height:0; max-height:none; gap:3px; padding:6px; border-radius:16px}
  .sq{border-radius:7px}
}
@media (prefers-reduced-motion:reduce){
  .die{transition:none}
  .die-wrap.tossing, .bc-ticker span.fresh, .review-focus, .bc-wallet.bump{animation:none}
  .board-area{transition:none}
}
/* ================= OVERLAY (module + challenge) ================= */
.overlay-back{position:fixed; inset:0; background:rgba(10,16,15,.55); z-index:70; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:18px 10px 40px}
.overlay-card{background:var(--bg); border-radius:22px; max-width:1080px; width:100%; padding:20px 18px 30px; position:relative; margin-top:10px}
.overlay-close{position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line); background:var(--panel); cursor:pointer; font-size:1.1rem}
.lo-head{padding-right:44px; margin-bottom:6px}
.lo-kicker{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent)}
.lo-title{font-size:clamp(1.4rem,4vw,1.9rem); font-weight:800; margin-top:2px}
.lo-hook{margin-top:8px; font-size:.94rem; max-width:70ch; background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:12px; padding:10px 12px}
.lo-goals{list-style:none; margin:14px 0 0; display:flex; flex-direction:column; gap:6px}
.lo-goals li{display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:start; font-size:.9rem}
.lo-goals .box{width:20px; height:20px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.72rem; margin-top:1px; flex:none}
.lo-goals li.done .box{background:var(--good); border-color:var(--good); color:#fff}
.lo-goals li.done .tx{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--good)}

/* Lab (reused bench UI) */
.lab-wrap{margin-top:16px}
.lab{display:grid; grid-template-columns:290px 1fr; gap:16px; align-items:start}
.panel{background:var(--panel); border:1.5px solid var(--line); border-radius:18px; padding:16px 18px}
h2.pt{font-size:1.1rem; font-weight:600; margin:0 0 10px}
.shelf-list{display:flex; flex-direction:column; gap:8px}
.item{display:grid; grid-template-columns:50px 1fr; align-items:center; gap:10px; text-align:left; width:100%; background:transparent; border:1.5px solid var(--line); border-radius:12px; padding:7px 10px 7px 7px; cursor:pointer}
.item:hover{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent)}
.item:active{transform:translateY(1px)}
.item .ic{display:flex; justify-content:center; align-items:center; line-height:0}
.item .nm{font-weight:600; font-size:.95rem; line-height:1.25; display:block}
.item .ds{font-size:.78rem; color:var(--muted); line-height:1.3; display:block; margin-top:2px}
.shelf-note{font-size:.8rem; color:var(--muted); margin:12px 0 0}
.legend{display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; margin-top:12px; font-size:.78rem; color:var(--muted)}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:50%; border:1.5px solid #1b2422; flex:none}
.seg{display:flex; border:1.5px solid var(--line); border-radius:12px; padding:3px; gap:3px; margin-bottom:12px}
.seg button{flex:1; border:0; border-radius:9px; background:transparent; padding:7px 8px; cursor:pointer; font-weight:500; font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.bench-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; margin-bottom:6px}
.tools{display:flex; flex-wrap:wrap; gap:6px}
.howto{margin:0 0 12px; font-size:.88rem; color:var(--muted)}
.mat{position:relative; background-color:var(--mat); background-image:linear-gradient(var(--mat-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid) 1px,transparent 1px); background-size:24px 24px; border-radius:16px; min-height:300px; padding:18px; overflow:hidden; color:var(--mat-ink)}
.empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--mat-muted); font-size:1rem}
.empty p{max-width:26em; margin:0}
.mols{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start}
.mol{border:2px dashed rgba(255,255,255,.18); border-radius:14px; padding:10px 12px 10px; cursor:pointer; max-width:100%}
.mol.active{border:2px solid var(--accent); background:rgba(255,255,255,.06)}
.chain{display:flex; flex-wrap:wrap; row-gap:10px; align-items:flex-start}
.unit{display:flex; align-items:flex-start}
.tile{display:block; flex:none}
.cap{margin-top:8px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; line-height:1.3}
.cap .nm{font-weight:600; font-size:.92rem}
.cap .kd{font-size:.78rem; color:var(--mat-muted)}
.sel{font-size:.74rem; border:1px solid rgba(255,255,255,.4); background:transparent; color:var(--mat-ink); border-radius:999px; padding:2px 10px; cursor:pointer}
.mol.active .sel{background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:600}
.bond{appearance:none; border:0; background:transparent; width:24px; height:var(--tile-h,64px); position:relative; padding:0; cursor:pointer; flex:none; margin:0 -1px}
.bond::before{content:""; position:absolute; left:-3px; right:-3px; top:calc(var(--bond-y,32px) - 3px); height:6px; background:#f1f5f3; border-radius:3px; border:1px solid #1b2422}
.bond.o::after{content:""; position:absolute; left:50%; top:var(--bond-y,32px); width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; background:#e0463c; border:1.5px solid #1b2422}
.bond:hover::before,.bond:focus-visible::before{background:repeating-linear-gradient(90deg,#ffb4ab 0 4px,#1b2422 4px 6px)}
.bond:focus-visible{outline-offset:0}
.lipid-svg{display:block; width:100%; max-width:560px; height:auto}
.lbond{cursor:pointer}
.lbond:hover .bline,.lbond:focus-visible .bline{stroke:#ffb4ab; stroke-dasharray:5 3}
.lbond:focus-visible{outline:none}
.lbond:focus-visible .bhit{stroke:var(--accent); stroke-width:3}
.hint{min-height:1.5em; margin:10px 2px 0; font-size:.88rem; color:var(--muted)}
.hint.warn{color:var(--warn); background:var(--warn-bg); border-radius:10px; padding:6px 10px}
.selected{margin-top:10px; border-left:4px solid var(--accent); padding:4px 0 4px 14px}
.selected .t{font-weight:600}
.selected .k{color:var(--muted); font-size:.85rem; margin-left:6px}
.selected p{margin:4px 0 0; font-size:.92rem; max-width:62ch}
.selected .sq2{font-size:.88rem; letter-spacing:.02em; margin-top:4px; overflow-wrap:anywhere}
.h2o{position:absolute; pointer-events:none; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.72rem; font-weight:700; color:#fff; z-index:5; text-shadow:0 1px 2px rgba(0,0,0,.5)}
.h2o.out{animation:wout 1.6s ease-out forwards}
.h2o.in{animation:win 1.1s ease-in forwards}
@keyframes wout{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)} 15%{opacity:1; transform:translate(-50%,-60%) scale(1.2)} 100%{opacity:0; transform:translate(-50%,-240%) scale(1)}}
@keyframes win{0%{opacity:0; transform:translate(-50%,-260%) scale(1)} 65%{opacity:1; transform:translate(-50%,-55%) scale(1.1)} 100%{opacity:0; transform:translate(-50%,-50%) scale(.2)}}
@media (prefers-reduced-motion:reduce){.h2o{display:none}.bump{animation:none}}
.lower{display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:16px; margin-top:16px; align-items:start}
.lower.lower-2col{grid-template-columns:1.25fr 1fr}
.ledger{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.chip{display:flex; align-items:center; gap:8px; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:6px 12px 6px 8px}
.chip .n{font-size:1.15rem; font-weight:700; line-height:1; min-width:1.2ch}
.chip .l{font-size:.72rem; color:var(--muted); line-height:1.2; max-width:11em}
.log{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.log li{border-top:1px solid var(--line); padding-top:10px; font-size:.88rem; color:var(--muted)}
.log li:first-child{border-top:0; padding-top:0; color:var(--ink); font-size:1rem}
.log .rx{font-weight:600; display:block; margin-bottom:2px}
.log li:first-child .rx{color:var(--accent); filter:brightness(.8)}
.log .eq{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; line-height:1.35}
.log li:first-child .eq{font-size:1.05rem; font-weight:500}
.log .why{display:block; margin-top:3px; font-size:.84rem; color:var(--muted)}
.wi{display:inline-flex; align-items:center; gap:3px; white-space:nowrap; font-weight:600}
.arrow{font-weight:700; padding:0 2px}
.log-empty{color:var(--muted); font-size:.92rem; margin:0}
.facts dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:.88rem}
.facts dt{font-weight:600; color:var(--muted)}
.facts dd{margin:0}
.factshook{margin:12px 0 0; font-size:.9rem; padding:10px 12px; border-radius:12px; background:color-mix(in srgb, var(--accent) 12%, transparent)}

/* Learn Lab: tabs, challenges list, learning targets, toast (restored from the original prototype) */
.tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin:0 0 16px}
.tab{display:flex; align-items:center; gap:9px; flex:none; border:1.5px solid var(--line); background:var(--panel); border-radius:12px; padding:9px 16px 9px 12px; cursor:pointer; font-weight:500}
.tab svg{flex:none}
.tab[aria-selected="true"]{border-color:var(--accent); box-shadow:inset 0 -4px 0 var(--accent); font-weight:600}
.tab:hover{border-color:var(--accent)}
.toast{display:none; background:var(--good-bg); color:var(--good); border-radius:10px; padding:8px 12px; font-weight:600; font-size:.9rem; margin-bottom:10px}
.toast.show{display:block}
.prog{margin:-4px 0 10px; font-size:.85rem; color:var(--muted)}
.chal{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.chal li{display:grid; grid-template-columns:24px 1fr; gap:10px; align-items:start; font-size:.92rem}
.chal .box{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.8rem; margin-top:1px}
.chal li.done .box{background:var(--good); border-color:var(--good); color:var(--panel)}
.chal li.done .tx{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--good)}
.targets{margin-top:16px}
.targets ul{margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(3,1fr); gap:10px 18px; font-size:.9rem}
.targets li{padding-left:14px; border-left:3px solid var(--line)}
@media (max-width:820px){ .targets ul{grid-template-columns:1fr} }

/* Home screen + shared screen nav */
.home-cards{display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:820px; margin:40px auto}
.home-card{background:var(--panel); border:1.5px solid var(--line); border-radius:22px; padding:32px 24px; text-align:center; cursor:pointer}
.home-card:hover{border-color:var(--accent)}
.home-card .hc-ic{font-size:2.6rem}
.home-card h2{font-size:1.3rem; margin-top:8px}
.home-card p{color:var(--muted); margin-top:8px; font-size:.92rem}
@media (max-width:640px){ .home-cards{grid-template-columns:1fr} }
.scr-nav{display:flex; gap:8px; flex-wrap:wrap}
.navpill{border:1.5px solid var(--brand-blue); background:var(--panel); border-radius:999px; padding:.5rem 1rem; cursor:pointer; font-weight:600; font-size:.88rem; color:var(--ink)}
.navpill:hover{background:color-mix(in srgb, var(--brand-blue) 15%, var(--panel))}
.navpill.active{background:var(--brand); color:var(--on-brand); border-color:var(--brand)}

/* Quiz */
.quiz{margin-top:18px; border-top:2px dashed var(--line); padding-top:16px}
.quiz-prog{font-size:.8rem; color:var(--muted); margin-bottom:8px; font-weight:600}
.quiz-q{font-size:1.05rem; font-weight:700; margin-bottom:12px}
.quiz-opts{display:flex; flex-direction:column; gap:8px}
.qopt{text-align:left; border:1.5px solid var(--line); background:var(--panel); border-radius:12px; padding:.7rem .9rem; cursor:pointer; font-size:.94rem}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt.correct{border-color:var(--good); background:var(--good-bg); font-weight:600}
.qopt.wrong{border-color:var(--warn); background:var(--warn-bg)}
.qopt:disabled{cursor:not-allowed}
.quiz-fb{margin-top:12px; font-size:.9rem; padding:10px 12px; border-radius:12px}
.quiz-fb.good{background:var(--good-bg); color:var(--good)}
.quiz-fb.warn{background:var(--warn-bg); color:var(--warn)}
.quiz-next{margin-top:14px}
.module-done{text-align:center; padding:28px 10px}
.module-done .big{font-size:2.4rem}
.module-done h3{font-size:1.5rem; margin-top:8px}
.module-done p{color:var(--muted); margin-top:6px}
.atp-pop{color:var(--atp-ink); font-weight:800; font-size:1.3rem; margin-top:10px}
@media (prefers-color-scheme: dark){.atp-pop{color:var(--atp)}}

/* Popup (small info/confirm) */
.popup-card{max-width:460px}
.popup-emoji{font-size:2.4rem; text-align:center}
.popup-txt{text-align:center; margin-top:8px; font-size:.98rem}
.popup-actions{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap}

@media (max-width:1020px){
  .lower{grid-template-columns:1fr 1fr}
  .lower.lower-2col{grid-template-columns:1fr}
  .lower > .challenges{grid-column:1 / -1}
}
@media (max-width:820px){
  .lab{grid-template-columns:1fr}
  .shelf-list{display:grid; grid-template-columns:1fr 1fr}
  .lower{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:14px 10px 40px}
  .shelf-list{grid-template-columns:1fr}
  .mat{padding:12px; min-height:260px}
  .item .ds{display:none}
  .shelf-list{grid-template-columns:1fr 1fr}
  .overlay-card{padding:16px 12px 24px; border-radius:16px}
}

</style>

function nameCarb(u){

function addLinear(key){
  const t = LAB.tab, T = LAB.tabs[t];
  const unit = t === 'nucleic' ? {b:key, s:T.mode} : key;
  let mol = T.mols.find(m => m.id === T.active);
  if(!mol){
    if(T.mols.length >= 6){ warnLab('The bench holds 6 molecules. Remove one or clear the bench to make room.'); return; }
    mol = {id:uid(), units:[unit]}; T.mols.push(mol); T.active = mol.id;
    renderLab(); afterAction({type:'place'}); return;
  }
  if(mol.zip){ warnLab('This strand is zipped into a double helix. Unzip it first, or tap “Start a new molecule”.'); return; }
  if(t === 'nucleic' && mol.units[0].s !== unit.s){ warnLab('DNA and RNA nucleotides don’t mix in one strand. Tap “Start a new molecule” first.'); return; }
  if(mol.units.length >= 12){ warnLab('That chain hit the bench limit of 12. Start a new molecule to keep building.'); return; }
  const before = describe(t, mol.units).eq;
  mol.units.push(unit);
  const after = describe(t, mol.units).eq;
  LAB.water.released++;
  pushLog({type:'syn', left:[before, monoName(t, unit)], right:[after], n:1});
  renderLab(); bump('chipOut'); playSfx('build');
  spawnWater(centerOf(document.querySelector('[data-bond="' + mol.id + '-' + (mol.units.length - 2) + '"]')), 'out');
  afterAction({type:'syn'});
}

  const pos = centerOf(document.querySelector('[data-bond="' + molId + '-' + i + '"]'));
  const len = mol.units.length;
  const before = describe(t, mol.units).eq;
  const left = mol.units.slice(0, i + 1), right = mol.units.slice(i + 1);
  if(T.mols.length >= 10){ warnLab('The bench is crowded. Remove a molecule before breaking more apart.'); return; }
  mol.units = left;
  T.mols.splice(idx + 1, 0, {id:uid(), units:right});
  LAB.water.used++;
  pushLog({type:'hyd', left:[before], right:[describe(t, left).eq, describe(t, right).eq], n:1});
  renderLab(); bump('chipIn'); spawnWater(pos, 'in'); playSfx('break');

  const mol = T.mols[idx], n = mol.units.length - 1; if(n < 1) return;
  if(mol.zip){ warnLab('Unzip the double helix before breaking its backbone.'); return; }
  if(T.mols.length + n > 16){ warnLab('Breaking every bond would overflow the bench. Remove a molecule first.'); return; }
  const positions = [];
  for(let i = 0; i < n; i++) positions.push(centerOf(document.querySelector('[data-bond="' + mol.id + '-' + i + '"]')));
  const before = describe(t, mol.units).eq;
  const len = mol.units.length;
  const pieces = mol.units.map(u => ({id:uid(), units:[u]}));
  T.mols.splice(idx, 1, ...pieces);
  T.active = pieces[0].id;
  LAB.water.used += n;
  const names = mol.units.map(u => monoName(t, u));
  pushLog({type:'hyd', left:[before], right:names.length > 4 ? [names.length + ' monomers'] : names, n});
  renderLab(); bump('chipIn'); playSfx('break');
  positions.forEach((p, k) => spawnWater(p, 'in', k * 110));
  afterAction({type:'hyd', len});
}

/* ---------- actions: lipids ---------- */
function addLipid(key){
  const L = LAB.tabs.lipids;
  if(key === 'glycerol'){
    if(L.glycerol){ warnLab('One glycerol at a time. Clear the bench to start a new lipid.'); return; }
    L.glycerol = true; renderLab(); afterAction({type:'place'}); return;
  }
  if(!L.glycerol){ warnLab('Start with a glycerol backbone. Fatty acids and phosphates need something to bond to.'); return; }
  let slot;
  if(key === 'phos'){
    if(L.slots[2]){ warnLab('Carbon 3 is taken, and phosphate only bonds to carbon 3. Break that bond first.'); return; }
    slot = 2;
  } else {
    slot = L.slots.findIndex(s => !s);
    if(slot < 0){ warnLab('All three carbons are bonded. Break a bond to swap a piece.'); return; }
  }
  const before = nameLipid(L).eq;
  L.slots[slot] = key;
  const after = nameLipid(L);
  if(L.slots.filter(s => s === 'sat' || s === 'unsat').length === 3) L.wasTri = true;
  LAB.water.released++;
  pushLog({type:'syn', left:[before, LIPID_PARTS[key].name], right:[after.eq], n:1});
  renderLab(); bump('chipOut'); playSfx('build');
  spawnWater(centerOf(document.querySelector('[data-lbond="' + slot + '"] circle')), 'out');
  afterAction({type:'syn'});
}
function breakLipid(i){
  const L = LAB.tabs.lipids; if(!L.slots[i]) return;
  const pos = centerOf(document.querySelector('[data-lbond="' + i + '"] circle'));
  const before = nameLipid(L).eq, piece = L.slots[i];
  L.slots[i] = null;
  LAB.water.used++;
  pushLog({type:'hyd', left:[before], right:[nameLipid(L).eq, LIPID_PARTS[piece].name], n:1});
  renderLab(); bump('chipIn'); spawnWater(pos, 'in'); playSfx('break');
  lipidDigestCheck();
}
function breakAllLipid(){
  const L = LAB.tabs.lipids;
  const filled = L.slots.map((s, i) => s ? i : -1).filter(i => i >= 0); if(!filled.length) return;
  const positions = filled.map(i => centerOf(document.querySelector('[data-lbond="' + i + '"] circle')));
  const before = nameLipid(L).eq, parts = filled.map(i => LIPID_PARTS[L.slots[i]].name);
  L.slots = [null, null, null];
  LAB.water.used += filled.length;
  pushLog({type:'hyd', left:[before], right:['Glycerol'].concat(parts), n:filled.length});
  renderLab(); bump('chipIn'); playSfx('break');

/* ---------- double helix: pick two DNA strands, zip, unzip ----------
   Pairing is by hydrogen bonds, NOT dehydration synthesis/hydrolysis, so
   zipping and unzipping never touch LAB.water. Strands pair position by
   position with the bottom strand read 3'→5' (the same convention as "Show
   matching strand"); a true reverse complement is also accepted and drawn
   flipped. A zipped molecule is {id, units:top, zip:{partner, orient, orig}}. */
function hbCount(units){ return units.reduce((n, u) => n + HB[u.b], 0); }
function togglePick(id){
  const T = LAB.tabs.nucleic;
  T.mismatch = null;
  T.pick = T.pick.includes(id) ? T.pick.filter(x => x !== id) : T.pick.concat(id).slice(-2);
  renderLab();
}
function zipStrands(){
  const T = LAB.tabs.nucleic;
  if(T.pick.length !== 2){ warnLab('Pick two DNA strands first (tap “Pick for helix” on each).'); return; }
  const a = T.mols.find(m => m.id === T.pick[0]), b = T.mols.find(m => m.id === T.pick[1]);
  if(!a || !b){ T.pick = []; renderLab(); return; }
  if(a.units[0].s === 'RNA' || b.units[0].s === 'RNA'){ warnLab('RNA can’t zip into a double helix here. RNA is usually single-stranded: it works as a single working copy of a gene’s instructions.'); return; }
  if(a.units.length !== b.units.length){ warnLab('Pick two strands of the same length (these have ' + a.units.length + ' and ' + b.units.length + ' nucleotides).'); return; }
  const fits = list => a.units.every((u, i) => list[i].b === PAIR[u.b]);
  const rev = b.units.slice().reverse();
  const orient = fits(b.units) ? 'pos' : fits(rev) ? 'rev' : null;
  if(!orient){
    T.mismatch = {top:a.id, bot:b.id, bad:a.units.map((u, i) => b.units[i].b === PAIR[u.b] ? -1 : i).filter(i => i >= 0)};
    renderLab(); playSfx('wrong');
    warnLab('Not every base pairs. A pairs with T and G pairs with C. Mismatches are marked with the partner each base needs.');
    return;
  }
  const n = a.units.length, hb = hbCount(a.units);
  a.zip = {partner: orient === 'pos' ? b.units : rev, orient, orig: b.units};
  T.mols = T.mols.filter(m => m.id !== b.id);
  T.active = a.id; T.pick = []; T.mismatch = null; T.justZipped = a.id;
  pushLog({type:'pair', left:['DNA strand (' + n + ')', 'DNA strand (' + n + ')'], right:['DNA double helix (' + n + ' base pairs)'], hb});
  renderLab(); playSfx('buy');
  afterAction({type:'zip', len:n});
}
function unzipStrands(id){
  const T = LAB.tabs.nucleic, idx = T.mols.findIndex(m => m.id === id); if(idx < 0) return;
  const m = T.mols[idx]; if(!m.zip) return;
  const n = m.units.length, hb = hbCount(m.units), other = {id:uid(), units:m.zip.orig};
  delete m.zip;
  T.mols.splice(idx + 1, 0, other);
  pushLog({type:'unpair', left:['DNA double helix (' + n + ' base pairs)'], right:['DNA strand (' + n + ')', 'DNA strand (' + n + ')'], hb});
  renderLab(); playSfx('break');
  afterAction({type:'unzip', len:n});
}

function duplexHTML(top, bottom, opts){
  opts = opts || {};

  const cols = 'grid-template-columns:26px repeat(' + n + ',48px) 26px';
  const bonds = top.map((u, i) => {
    if(bad.includes(i)) return '<span class="hb bad" style="--i:' + i + '"><b>✕</b><small>needs ' + PAIR[u.b] + '</small></span>';
    return '<span class="hb" style="--i:' + i + '">' + Array.from({length:HB[u.b]}, () => '<i></i>').join('') + '</span>';
  }).join('');

    '<span class="end">5′</span>' + top.map(u => '<span class="dx">' + nucTile(u, false, 44) + '</span>').join('') + '<span class="end">3′</span>' +
    '<span></span>' + bonds + '<span></span>' +
    '<span class="end">3′</span>' + bottom.map((u, i) => '<span class="dx">' + nucTileDown(u, 44, bad.includes(i)) + '</span>').join('') + '<span class="end">5′</span>' +
  '</div>';

function helixSVG(top, bottom){
  const n = top.length, W = 52 + n * 48, H = 128, mid = 64, amp = 40, k = Math.PI / 4;
  const xAt = i => 50 + i * 48, phase = x => (x - 50) / 48 * k;
  let s1 = [], s2 = [];
  for(let x = 26; x <= W - 26; x += 4){ s1.push([x, mid - amp * Math.sin(phase(x))]); s2.push([x, mid + amp * Math.sin(phase(x))]); }
  let rungs = '';
  top.forEach((u, i) => {
    const x = xAt(i), y1 = mid - amp * Math.sin(phase(x)), y2 = mid + amp * Math.sin(phase(x)), ym = (y1 + y2) / 2;
    rungs += '<line x1="' + x + '" y1="' + y1.toFixed(1) + '" x2="' + x + '" y2="' + ym.toFixed(1) + '" stroke="' + BASES[u.b].color + '" stroke-width="5" stroke-linecap="round"/>' +
      '<line x1="' + x + '" y1="' + ym.toFixed(1) + '" x2="' + x + '" y2="' + y2.toFixed(1) + '" stroke="' + BASES[bottom[i].b].color + '" stroke-width="5" stroke-linecap="round"/>';
  });
  return '<svg class="helix-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Twisted double helix with ' + n + ' base pairs">' + rungs +
    '<polyline points="' + ptsStr(s1) + '" fill="none" stroke="#c9d4f5" stroke-width="5" stroke-linecap="round"/>' +
    '<polyline points="' + ptsStr(s2) + '" fill="none" stroke="#a88af0" stroke-width="5" stroke-linecap="round"/>' +
    '<text x="8" y="' + (mid + 4) + '" font-size="11" font-weight="700" fill="#e8f3ef">5′</text><text x="' + (W - 16) + '" y="' + (mid + 4) + '" font-size="11" font-weight="700" fill="#e8f3ef">3′</text>' +
  '</svg>';
}

function atpStationAct(kind){
  const T = LAB.tabs.nucleic;
  if(kind === 'spend' && T.atpForm === 'ATP'){
    T.atpForm = 'ADP'; LAB.water.used++;
    pushLog({type:'atpHyd', left:['ATP'], right:['ADP', 'phosphate', 'energy'], n:1,
      why:'A water molecule was used to break off ATP’s last phosphate, releasing the energy stored in that bond.'});
    renderLab(); bump('chipIn'); playSfx('break'); atpBurst();
    afterAction({type:'atpSpend'});
  } else if(kind === 'recharge' && T.atpForm === 'ADP'){
    T.atpForm = 'ATP'; LAB.water.released++;
    pushLog({type:'atpSyn', left:['ADP', 'phosphate', 'energy'], right:['ATP'], n:1,
      why:'A water molecule was removed to bond the phosphate back on. The energy came from breaking down food in cellular respiration.'});
    renderLab(); bump('chipOut'); playSfx('build');
    afterAction({type:'atpRecharge'});
  }
}
function atpBurst(){
  if(reduceMotion) return;
  const st = $('atpStage'); if(!st) return;
  const b = document.createElement('div'); b.className = 'energy-burst';
  for(let i = 0; i < 14; i++){
    const s = document.createElement('i'), a = i / 14 * Math.PI * 2, d = 50 + Math.random() * 40;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    b.appendChild(s);
  }
  st.appendChild(b);
  setTimeout(() => b.remove(), 900);
}

const HL = (x, y, rx, ry, rot) => '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '"' + (rot ? ' transform="rotate(' + rot + ' ' + x + ' ' + y + ')"' : '') + ' fill="#fff" opacity=".5"/>';
function isoCube(cx, y, s){
  const h = s / 2;
  return '<polygon points="' + [cx - s, y + h, cx, y + s, cx, y + 2 * s, cx - s, y + 1.5 * s].join(',') + '" fill="#e6ecf4"' + Kt(2) + '/>' +
    '<polygon points="' + [cx, y + s, cx + s, y + h, cx + s, y + 1.5 * s, cx, y + 2 * s].join(',') + '" fill="#c9d3e3"' + Kt(2) + '/>' +
    '<polygon points="' + [cx, y, cx + s, y + h, cx, y + s, cx - s, y + h].join(',') + '" fill="#fff"' + Kt(2) + '/>' +
    '<circle cx="' + (cx - 2) + '" cy="' + (y + h) + '" r="1" fill="#b9c4d6"/><circle cx="' + (cx + 3) + '" cy="' + (y + h + 1.5) + '" r="1" fill="#b9c4d6"/>';
}

   PART 4: persistence (localStorage, wrapped in try/catch) + sound
============================================================ */
const SAVE_KEY = 'monopoly_bioquest_v1';
const SOUND_KEY = 'monopoly_bioquest_sound';
const BLUR_KEY = 'monopoly_bioquest_blur';

function loadStore(){
  let store;
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    store = raw ? JSON.parse(raw) : {players:{}, current:null};
  }catch(e){ store = {players:{}, current:null}; }
  delete store.teacherTimersOff; // dropped field from a removed Teacher Settings feature
  return store;
}
function saveStore(store){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(store)); }catch(e){ /* private mode / storage full — progress just won't persist */ }
}
function loadSoundPref(){
  try{ return localStorage.getItem(SOUND_KEY) === '1'; }catch(e){ return false; }
}
function saveSoundPref(on){
  try{ localStorage.setItem(SOUND_KEY, on ? '1' : '0'); }catch(e){}
}
/* Blurring the board behind an open card can lag on low-powered Chromebooks,
   so it defaults to on only for devices with >4 cores and >4GB; anyone can
   flip it in Settings. Off just means the board is dimmed, not blurred. */
function loadBlurPref(){
  let v = null;
  try{ v = localStorage.getItem(BLUR_KEY); }catch(e){}
  if(v === '1') return true;
  if(v === '0') return false;
  const cores = navigator.hardwareConcurrency || 2, mem = navigator.deviceMemory || 8;
  return cores > 4 && mem > 4;
}
function saveBlurPref(on){
  try{ localStorage.setItem(BLUR_KEY, on ? '1' : '0'); }catch(e){}
}

function freshPlayer(name){
  return {

    showdown:{bestStars:0, lastStars:0, badge:false, attempts:0},
    createdAt: Date.now(), lastPlayed: Date.now()
  };
}
function normalizePlayer(p){
  // Migration: fills in fields added after a player's save was first created,
  // and drops fields from removed features. Never touches atp/owned/pos/etc —
  // existing progress is preserved as-is.
  p.goalsDone = p.goalsDone || {};
  p.quizDone = p.quizDone || {};
  p.owned = p.owned || {};
  p.setBonus = p.setBonus || {};
  p.labChallenges = p.labChallenges || {};
  p.enzymeDone = p.enzymeDone || {};     // Enzyme Card id -> solved (for Report Card levels)
  p.showdownDone = p.showdownDone || {}; // SHOWDOWN_ROUNDS index -> solved at least once
  p.denatureDone = p.denatureDone || {}; // DENATURE_QUESTIONS index -> answered correctly
  // Quiz/goal arrays grow when a module gains questions; pad, never overwrite.
  Object.keys(p.quizDone).forEach(id => { const m = MODULES[id]; if(m) while(p.quizDone[id].length < m.quiz.length) p.quizDone[id].push(false); });
  if(!p.showdown || typeof p.showdown.bestStars !== 'number') p.showdown = {bestStars:0, lastStars:0, badge:false, attempts:0};
  if(typeof p.pos !== 'number') p.pos = 0;
  if(!p.color) p.color = PLAYER_COLORS[0].hex;
  delete p.timerSetting; // dropped field: timers were removed
  delete p.teacherUnlock; // dropped field: Teacher Settings / board locking were removed
  return p;
}

/* ---------- sound (WebAudio synth, no audio files, off by default) ---------- */
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return audioCtx;
  try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  return audioCtx;
}
function tone(freq, start, dur, type, gain){
  const ctx = ensureAudio(); if(!ctx) return;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type || 'sine'; osc.frequency.value = freq;
  g.gain.value = 0;
  osc.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function playSfx(kind){
  if(!SOUND_ON) return;
  if(kind === 'build') tone(520, 0, .12, 'sine');
  else if(kind === 'break') tone(220, 0, .14, 'sawtooth', .08);
  else if(kind === 'dice') tone(300, 0, .08, 'square', .07);
  else if(kind === 'move') tone(440, 0, .05, 'square', .05);
  else if(kind === 'atp'){ tone(660, 0, .09, 'sine'); tone(880, .07, .12, 'sine'); }
  else if(kind === 'correct'){ tone(523, 0, .1, 'sine'); tone(784, .09, .16, 'sine'); }
  else if(kind === 'wrong') tone(160, 0, .22, 'sawtooth', .09);
  else if(kind === 'buy'){ tone(523, 0, .1, 'sine'); tone(659, .09, .1, 'sine'); tone(784, .18, .22, 'sine'); }
  else if(kind === 'open') tone(392, 0, .08, 'triangle', .06);
  else if(kind === 'flip'){ tone(700, 0, .05, 'triangle', .05); tone(940, .06, .07, 'triangle', .05); }
  else if(kind === 'coin') tone(1180, 0, .07, 'sine', .06);
}

/* ---------- ATP wallet + flying coins ---------- */
function shownATP(){ return PLAYER.atp - UI.atpInFlight; }
function rankFor(atp){
  let label = RANKS[0].label;
  for(const r of RANKS) if(atp >= r.min) label = r.label;
  return label;
}
const RANKS = [
  {min:0, label:'Rookie Mustang'},
  {min:150, label:'Junior Varsity Mustang'},
  {min:400, label:'Varsity Mustang'},
  {min:800, label:'All-Conference Mustang'},
  {min:1400, label:'Mustang Champion'}
];
function refreshWallets(){
  const n = shownATP();
  ['walletN', 'bcWalletN'].forEach(id => {
    const el = $(id); if(!el) return;
    const from = parseInt(el.textContent, 10) || 0;
    if(reduceMotion || from === n){ el.textContent = n; return; }
    const t0 = performance.now(), dur = 420;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(from + (n - from) * k);
      if(k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  const rk = $('bcRank'); if(rk) rk.textContent = rankFor(n);
}
function awardATP(n, src){
  PLAYER.atp += n;
  playSfx('atp');
  const target = $('walletChip');
  if(reduceMotion || !target){ refreshWallets(); bump('walletChip'); bump('bcWallet'); return; }
  UI.atpInFlight += n;
  document.body.classList.add('atp-lift');
  flyCoins(n, src, () => {
    UI.atpInFlight = Math.max(0, UI.atpInFlight - n);
    if(!UI.atpInFlight) setTimeout(() => { if(!UI.atpInFlight) document.body.classList.remove('atp-lift'); }, 600);
    refreshWallets(); bump('walletChip'); bump('bcWallet'); playSfx('coin');
  });
}
function rectCenter(el){ const r = el.getBoundingClientRect(); return {x:r.left + r.width / 2, y:r.top + r.height / 2}; }
function flyCoins(n, src, done){
  const srcEl = (typeof src === 'string' ? document.querySelector(src) : src) || $('cardMain') || $('token');
  const tgtEl = $('walletChip');
  const a = srcEl ? rectCenter(srcEl) : {x:innerWidth / 2, y:innerHeight / 2};
  const b = rectCenter(tgtEl);
  const count = Math.max(3, Math.min(9, Math.round(n / 8)));
  let last = 0;
  for(let i = 0; i < count; i++){
    const c = document.createElement('div');
    c.className = 'coin-fly'; c.innerHTML = atpIcon(26);
    document.body.appendChild(c);
    const sx = a.x - 13 + (Math.random() - .5) * 60, sy = a.y - 13 + (Math.random() - .5) * 40;
    const ex = b.x - 13, ey = b.y - 13;
    const mx = (sx + ex) / 2 + (Math.random() - .5) * 80, my = Math.min(sy, ey) - 60 - Math.random() * 60;
    const delay = i * 55, dur = 620 + Math.random() * 160;
    last = Math.max(last, delay + dur);
    c.animate([
      {transform:'translate(' + sx + 'px,' + sy + 'px) scale(.4)', opacity:0},
      {transform:'translate(' + sx + 'px,' + (sy - 14) + 'px) scale(1.1)', opacity:1, offset:.15},
      {transform:'translate(' + mx + 'px,' + my + 'px) scale(1)', opacity:1, offset:.55},
      {transform:'translate(' + ex + 'px,' + ey + 'px) scale(.55)', opacity:.9}
    ], {duration:dur, delay, easing:'cubic-bezier(.4,.1,.6,1)', fill:'both'});
    setTimeout(() => c.remove(), delay + dur + 30);
  }
  setTimeout(done, last);
}

/* ---------- 3D dice ----------
   Each die is a CSS cube (6 faces + 3 inner "core" planes that fill the gaps
   left by the rounded face corners). FACE_ROT is the cube rotation that turns
   face N toward the viewer; rolls add whole turns on top so it tumbles. */
const PIPS = {1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9]};
const FACE_ROT = {1:[0,0], 2:[-90,0], 3:[0,-90], 4:[0,90], 5:[90,0], 6:[0,180]};
function faceRot(n, turns){ return {x:FACE_ROT[n][0] + 360 * turns, y:FACE_ROT[n][1] + 360 * turns, z:0}; }
function dieTransform(r){ return 'rotateX(' + r.x + 'deg) rotateY(' + r.y + 'deg) rotateZ(' + r.z + 'deg)'; }
function dieHTML(k){
  if(!UI.diceRot) UI.diceRot = [faceRot(UI.dice[0], 0), faceRot(UI.dice[1], 0)];
  let faces = '<span class="core"></span><span class="core cx"></span><span class="core cy"></span>';
  for(let n = 1; n <= 6; n++){
    faces += '<span class="face f' + n + '">' + PIPS[n].map(p => '<i class="pip" style="grid-row:' + (Math.floor((p - 1) / 3) + 1) + ';grid-column:' + ((p - 1) % 3 + 1) + '"></i>').join('') + '</span>';
  }
  return '<span class="die-wrap"><span class="die-tilt"><span class="die" style="transform:' + dieTransform(UI.diceRot[k]) + '">' + faces + '</span></span></span>';
}
function spinTo(prev, face, extra){
  const [fx, fy] = FACE_ROT[face];
  return {
    x: Math.ceil(prev.x / 360) * 360 + 360 * (2 + extra) + fx,
    y: Math.ceil(prev.y / 360) * 360 + 360 * (1 + extra) + fy,
    z: prev.z + 360 * (extra ? -1 : 1)
  };
}
function setRollingUI(on){
  ['rollBtn', 'diceBtn'].forEach(id => { const b = $(id); if(b) b.disabled = on; });
}
function rollDice(){
  if(UI.rolling || UI.overlay || UI.popup) return;
  UI.rolling = true; setRollingUI(true);
  const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6);
  UI.dice = [a, b];
  UI.diceRot = [spinTo(UI.diceRot[0], a, 0), spinTo(UI.diceRot[1], b, 1)];
  const dies = document.querySelectorAll('.die');
  dies.forEach((d, i) => { d.style.transform = dieTransform(UI.diceRot[i]); });
  playSfx('dice');
  if(reduceMotion){ afterDice(); return; }
  document.querySelectorAll('.die-wrap').forEach(w => { w.classList.remove('tossing'); void w.offsetWidth; w.classList.add('tossing'); });
  [250, 520, 800].forEach(t => setTimeout(() => playSfx('dice'), t));
  setTimeout(afterDice, 1150);
}
function afterDice(){
  const [a, b] = UI.dice, sum = a + b;
  PLAYER.lastRoll = sum;
  UI.diceNote = 'Rolled ' + a + ' + ' + b + ' = ' + sum;
  const note = $('diceNote'); if(note) note.textContent = UI.diceNote;
  document.querySelectorAll('.die-wrap').forEach(w => w.classList.remove('tossing'));
  stepToken(sum);
}

/* ---------- token: hops square by square ---------- */
function tokenBox(idx){
  const board = $('board'), sq = document.querySelector('.sq[data-idx="' + idx + '"]');
  if(!board || !sq) return null;
  const anchor = sq.querySelector('.sq-art') || sq;
  const br = board.getBoundingClientRect(), ar = anchor.getBoundingClientRect(), sr = sq.getBoundingClientRect();
  const h = Math.max(22, Math.min(54, sr.height * .66)), w = h * 40 / 48;
  return {x:ar.left + ar.width / 2 - br.left - w / 2, y:ar.top + ar.height / 2 - br.top - h * .62, w, h};
}
function markHere(idx){
  document.querySelectorAll('.sq[data-here]').forEach(el => el.removeAttribute('data-here'));
  const el = document.querySelector('.sq[data-idx="' + idx + '"]'); if(el) el.setAttribute('data-here', 'true');
}
function placeToken(){
  const tk = $('token'), p = tokenBox(PLAYER.pos); if(!tk || !p) return;
  tk.style.width = p.w + 'px'; tk.style.height = p.h + 'px';
  tk.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
  markHere(PLAYER.pos);
}
function hopToken(from, to){
  const tk = $('token'), a = tokenBox(from), b = tokenBox(to); if(!tk || !a || !b) return;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - Math.max(18, b.h * .6);
  tk.style.width = b.w + 'px'; tk.style.height = b.h + 'px';
  tk.animate([
    {transform:'translate(' + a.x + 'px,' + a.y + 'px) scale(1)'},
    {transform:'translate(' + mx + 'px,' + my + 'px) scale(1.14)', offset:.5},
    {transform:'translate(' + b.x + 'px,' + b.y + 'px) scale(1,.9)', offset:.88},
    {transform:'translate(' + b.x + 'px,' + b.y + 'px) scale(1)'}
  ], {duration:230, easing:'ease-in-out'});
  tk.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
  markHere(to);
}
function stepToken(remaining){
  if(remaining <= 0){
    UI.rolling = false; setRollingUI(false);
    placeToken(); persist();
    landOn(PLAYER.pos);
    return;
  }
  const from = PLAYER.pos, next = (from + 1) % SQUARES.length;
  PLAYER.pos = next;
  if(next === 0){
    // Passing (or landing on) GO pays out the moment the token touches it.
    PLAYER.laps = (PLAYER.laps || 0) + 1;
    awardATP(CFG.ATP_PASS_GO, '.sq[data-idx="0"]');
    logActivity('Passed GO (+' + CFG.ATP_PASS_GO + ' ATP)');
  }
  if(reduceMotion){ stepToken(remaining - 1); return; }
  playSfx('move');
  hopToken(from, next);
  setTimeout(() => stepToken(remaining - 1), 250);
}
window.addEventListener('resize', () => { if(UI.screen === 'board' && !UI.rolling) placeToken(); });

function landOn(idx){
  const sq = SQUARES[idx];
  if(sq.type === 'go'){
    awardATP(CFG.ATP_LAND_GO_BONUS, '.sq[data-idx="0"]'); persist();
    logActivity('Landed right on GO (+' + CFG.ATP_LAND_GO_BONUS + ' ATP bonus)');
    showCard({mode:'info', band:'go', art:'go', kicker:'Bonus', title:'Welcome to the ATP Hub!', body:'Landing right on GO powers you up with a bonus, on top of the ' + CFG.ATP_PASS_GO + ' ATP you get for passing it.', atp:CFG.ATP_LAND_GO_BONUS}, 'sq-' + idx);
    return;
  }
  openSquare(sq, idx);
}

  if(sq.type === 'prop') openModule(sq.id);
  else if(sq.type === 'enzyme') openChallenge(sq.id);
  else if(sq.type === 'jail') openDenature(idx);

function originEl(origin){
  if(!origin || origin === 'center') return null;

function zoomCardFrom(card, r, dur){
  const to = card.getBoundingClientRect();
  const vis = Math.min(to.height, innerHeight - Math.max(0, to.top));
  const dx = (r.left + r.width / 2) - (to.left + to.width / 2), dy = (r.top + r.height / 2) - (to.top + vis / 2);
  const s = Math.max(.06, r.width / to.width);
  card.style.transformOrigin = '50% ' + (vis / 2) + 'px';
  return card.animate([
    {transform:'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')', opacity:.35},
    {transform:'none', opacity:1}
  ], {duration:dur, easing:'cubic-bezier(.2,.85,.25,1)'});
}
function ghostFrontHTML(o){

  else if(o.mode === 'challenge'){ band = o.tab; key = 'enzyme'; name = 'Enzyme Alert!'; }
  return '<div class="g-front" style="--gc:' + (BAND[band] || BAND.showdown).c + '"><span class="g-band"></span>' + artSVG(key) + '<b>' + esc(name) + '</b></div>';

function animateCardOpen(){
  const card = $('cardMain'); if(!card) return;
  try{ card.focus({preventScroll:true}); }catch(e){}
  playSfx('flip');
  if(reduceMotion) return;
  const o = UI.overlay;
  UI.cardBusy = true; setTimeout(() => { UI.cardBusy = false; }, 900);
  const dim = $('cardDim'); if(dim) dim.animate([{opacity:0}, {opacity:1}], {duration:320, easing:'ease-out'});
  const src = originEl(o.origin);
  if(!src){ zoomCardFrom(card, {left:innerWidth / 2 - 60, top:innerHeight / 2 - 40, width:120, height:80}, 340); return; }
  const r = src.getBoundingClientRect();
  if(o.origin.indexOf('deck-') !== 0){ zoomCardFrom(card, r, 380); return; }
  // Deck origin: a card flies off the deck, flips face-up, then grows into the full card.
  const g = document.createElement('div');
  g.className = 'card-ghost';
  g.style.cssText = 'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px';
  g.innerHTML = '<div class="g-inner"><div class="g-face">' + ghostFrontHTML(o) + '</div><div class="g-face g-back">' + deckBackHTML(o.origin === 'deck-enz' ? 'enz' : 'prop') + '</div></div>';
  document.body.appendChild(g);
  card.style.opacity = '0';
  const tw = Math.min(200, innerWidth * .42), sc = tw / r.width;
  const cx = innerWidth / 2, cy = innerHeight / 2;
  const dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
  g.animate([
    {transform:'translate(0,0) scale(1) rotate(0deg)'},
    {transform:'translate(' + dx * .55 + 'px,' + (dy * .55 - 50) + 'px) scale(' + sc * .7 + ') rotate(-6deg)', offset:.55},
    {transform:'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ') rotate(0deg)'}
  ], {duration:560, easing:'cubic-bezier(.3,.7,.3,1)', fill:'forwards'});
  g.firstChild.animate([{transform:'rotateY(180deg)'}, {transform:'rotateY(0deg)'}], {duration:560, easing:'ease-in-out', fill:'forwards'});
  setTimeout(() => {
    card.style.opacity = '';
    const gw = r.width * sc, gh = r.height * sc;
    zoomCardFrom(card, {left:cx - gw / 2, top:cy - gh / 2, width:gw, height:gh}, 320);
    g.animate([{opacity:1}, {opacity:0}], {duration:180, fill:'forwards'});
    setTimeout(() => g.remove(), 200);
  }, 540);
}
function animateCardClose(done){
  const card = $('cardMain'), o = UI.overlay;
  if(reduceMotion || !card || !o){ done(); return; }
  UI.cardBusy = true;
  const src = originEl(o.origin);
  const to = card.getBoundingClientRect();
  const vis = Math.min(to.height, innerHeight - Math.max(0, to.top));
  const r = src ? src.getBoundingClientRect() : {left:innerWidth / 2 - 40, top:innerHeight / 2 - 30, width:80, height:60};
  const dx = (r.left + r.width / 2) - (to.left + to.width / 2), dy = (r.top + r.height / 2) - (to.top + vis / 2);
  card.style.transformOrigin = '50% ' + (vis / 2) + 'px';
  document.body.classList.remove('card-open'); // lets the board blur ease back into focus
  const dim = $('cardDim'); if(dim) dim.animate([{opacity:1}, {opacity:0}], {duration:260, fill:'forwards'});
  const a = card.animate([
    {transform:'none', opacity:1},
    {transform:'translate(' + dx + 'px,' + dy + 'px) scale(' + Math.max(.06, r.width / to.width) + ')', opacity:0}
  ], {duration:260, easing:'cubic-bezier(.5,0,.75,.4)', fill:'forwards'});
  let finished = false;
  const fin = () => { if(finished) return; finished = true; UI.cardBusy = false; done(); };
  a.onfinish = fin; setTimeout(fin, 320);
}

function openShowdown(){
  if(!showdownUnlocked()) return;
  const order = SHOWDOWN_ROUNDS.map((_, i) => i);
  for(let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  showCard({mode:'showdown', order, idx:0, results:[], firstTry:true, resolved:false, finished:false, wrong:[]}, '#showdownBtn');
}
function currentShowdownRound(){ const o = UI.overlay; return SHOWDOWN_ROUNDS[o.order[o.idx]]; }
function showdownOverlayHTML(){
  const o = UI.overlay;
  if(o.finished) return showdownResultsHTML();
  const round = currentShowdownRound();
  const kindLabel = round.kind === 'build' ? 'Quick Build' : round.kind === 'riddle' ? 'What am I?' : 'Quick Check';
  const wrong = o.wrong || [];
  const fb = o.resolved ? showdownCorrectHTML(round) : '';
  let body;
  if(round.kind === 'build'){
    body = '<p class="lo-hook">' + esc(round.prompt) + '</p>' + labBenchHTML() + '<div id="sdFb">' + fb + '</div>';
  } else {
    const cluesHtml = round.clues ? '<ul style="margin:0 0 10px;padding-left:18px">' + round.clues.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>' : '';
    body = cluesHtml +
      '<p class="quiz-q">' + esc(round.q) + '</p>' +
      '<div class="quiz-opts" id="sdOpts">' + round.choices.map((c,i) => {
        const cls = o.resolved && i === round.correct ? ' correct' : wrong.includes(i) ? ' wrong' : '';
        return '<button class="qopt' + cls + '" data-sdopt="' + i + '"' + (o.resolved || wrong.includes(i) ? ' disabled' : '') + '>' + esc(c) + '</button>';
      }).join('') + '</div>' +
      '<div id="sdFb">' + (fb || (wrong.length ? '<div class="quiz-fb good">Welcome back. Give it another try.</div>' : '')) + '</div>';
  }
  return deedHead('showdown', 'Mogul Showdown · Round ' + (o.idx + 1) + ' of ' + SHOWDOWN_ROUNDS.length + ' · ' + GROUPS[round.group].label + ' · Level ' + round.lv, kindLabel) +
    '<div class="deed-body">' + body + '</div>';

function showdownCorrectHTML(round){
  const o = UI.overlay;
  return '<div class="quiz-fb good">Correct! ' + esc(round.explain) + '</div>' +
    '<button class="btn btn-primary quiz-next" id="sdNextBtn">' + (o.idx < SHOWDOWN_ROUNDS.length - 1 ? 'Next round' : 'See results') + '</button>';
}
function showdownResultsHTML(){
  const o = UI.overlay;
  return deedHead('showdown', 'Mogul Showdown', 'Showdown complete!') +
    '<div class="deed-body"><div class="module-done card-center">' + deedArt('showdown', 'trophy') +
      '<p style="font-size:2rem;margin-top:6px;color:#e2a52a">' + '★'.repeat(o.finalStars) + '☆'.repeat(3 - o.finalStars) + '</p>' +
