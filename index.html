<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonoPoly: Build the Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --panel:#ffffff; --ink:#1d2a28; --muted:#566762; --line:#d2dbd6;
  --mat:#1f5a52; --mat-grid:rgba(255,255,255,.07); --mat-ink:#e8f3ef; --mat-muted:#acd0c7;
  --carbs:#e8a33d; --proteins:#d94f6a; --lipids:#c2b12c; --nucleic:#5a7fe0;
  --accent:var(--mat); --on-accent:#fff;
  --good:#23804f; --good-bg:#e1f3e8; --warn:#a4481a; --warn-bg:#fbe9dd;
  --atp:#f2c14e; --atp-ink:#5c3d0a;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a19; --panel:#1a2523; --ink:#e3ebe8; --muted:#9fb2ad; --line:#2d3c39;
    --mat:#16403a; --good:#6fd29d; --good-bg:#183a2a; --warn:#f0a070; --warn-bg:#3d2517;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a19; --panel:#1a2523; --ink:#e3ebe8; --muted:#9fb2ad; --line:#2d3c39;
  --mat:#16403a; --good:#6fd29d; --good-bg:#183a2a; --warn:#f0a070; --warn-bg:#3d2517;
  color-scheme:dark;
}
body[data-tab="carbs"]{--accent:var(--carbs); --on-accent:#1b2422}
body[data-tab="proteins"]{--accent:var(--proteins); --on-accent:#fff}
body[data-tab="lipids"]{--accent:var(--lipids); --on-accent:#1b2422}
body[data-tab="nucleic"]{--accent:var(--nucleic); --on-accent:#fff}
body[data-tab="board"]{--accent:var(--mat); --on-accent:#fff}

*{box-sizing:border-box}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size:16px; line-height:1.5}
svg text{font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
img,svg{max-width:100%}
h1,h2,h3{margin:0}
p{margin:0}
ul{margin:0;padding:0}

.wrap{max-width:1200px; margin:0 auto; padding:22px 18px 48px}
.hidden{display:none !important}
.sr{position:absolute; left:-9999px}

/* ---------- Buttons shared ---------- */
.btn{font-size:.82rem; padding:.42rem .8rem; border-radius:999px; border:1.5px solid var(--line); background:var(--panel); cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn-primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600}
.btn-big{font-size:1rem; padding:.75rem 1.4rem; border-radius:14px; font-weight:700}

/* ================= ONBOARDING ================= */
.onboard{min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px}
.onboard-card{background:var(--panel); border:1.5px solid var(--line); border-radius:22px; padding:32px 28px; max-width:440px; width:100%; text-align:center}
.onboard-card h1{font-size:clamp(1.8rem,6vw,2.4rem); font-weight:800; letter-spacing:-.02em}
.onboard-card p{color:var(--muted); margin-top:10px; font-size:.96rem}
.onboard-card input[type=text]{width:100%; margin-top:20px; padding:.8rem 1rem; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-size:1.05rem}
.onboard-card .btn-primary{width:100%; margin-top:14px}
.player-list{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px}
.player-chip{border:1.5px solid var(--line); background:var(--bg); border-radius:999px; padding:.4rem .9rem; cursor:pointer; font-weight:600; font-size:.88rem}
.player-chip:hover{border-color:var(--accent)}
.onboard-note{margin-top:18px; font-size:.78rem; color:var(--muted)}

/* ================= HEADER ================= */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 18px; margin-bottom:16px}
.brand h1{font-size:clamp(1.6rem,4vw,2.2rem); font-weight:800; letter-spacing:-.02em; line-height:1}
.brand p{color:var(--muted); font-size:.85rem; margin-top:3px}
.hdr-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.wallet{display:flex; align-items:center; gap:10px; background:var(--panel); border:1.5px solid var(--atp); border-radius:14px; padding:8px 16px 8px 10px}
.wallet .ic{display:flex}
.wallet .n{font-size:1.5rem; font-weight:800; line-height:1; color:var(--atp-ink)}
:root[data-theme="dark"] .wallet .n,
@media (prefers-color-scheme: dark){.wallet .n{color:var(--atp)}}
.wallet .l{font-size:.72rem; color:var(--muted); line-height:1.15}
.wallet.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.iconbtn{width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line); background:var(--panel); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.05rem}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}

/* ================= BOARD ================= */
.board-shell{display:flex; flex-direction:column; align-items:center; gap:16px}
.board{width:min(96vw,640px); aspect-ratio:1; display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(6,1fr); gap:4px; background:var(--line); border-radius:18px; padding:4px}
.sq{border:0; border-radius:10px; background:var(--panel); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2px; position:relative; overflow:hidden; gap:2px}
.sq .ic{display:flex; align-items:center; justify-content:center}
.sq .lbl{font-size:clamp(.44rem,1.4vw,.66rem); font-weight:700; line-height:1.05; max-width:100%}
.sq.corner{border-radius:12px}
.sq.corner .lbl{font-size:clamp(.5rem,1.6vw,.72rem)}
.sq.prop{border-top:5px solid var(--gc,var(--line))}
.sq.prop.owned{background:color-mix(in srgb, var(--gc,var(--accent)) 22%, var(--panel))}
.sq.prop.owned::after{content:"\2713"; position:absolute; top:2px; right:4px; font-size:.6rem; font-weight:900; color:var(--good)}
.sq.enzyme{background:color-mix(in srgb, var(--atp) 30%, var(--panel))}
.sq.go{background:color-mix(in srgb, var(--good) 25%, var(--panel))}
.sq.jail{background:color-mix(in srgb, var(--proteins) 18%, var(--panel))}
.sq.park{background:color-mix(in srgb, var(--nucleic) 18%, var(--panel))}
.sq.bonus{background:color-mix(in srgb, var(--atp) 40%, var(--panel))}
.sq[data-here="true"]::before{content:""; position:absolute; inset:2px; border-radius:8px; border:3px solid var(--ink); pointer-events:none}
.token-chip{position:absolute; bottom:1px; left:50%; transform:translateX(-50%); font-size:1rem; line-height:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4)); z-index:2}
.sq.setdone .lbl{color:var(--good)}
.board-center{grid-column:2 / 6; grid-row:2 / 6; background:var(--mat); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12px; color:var(--mat-ink); text-align:center}
.token{font-size:clamp(1.6rem,5vw,2.2rem); line-height:1}
.die-face{font-size:clamp(2.6rem,9vw,3.6rem); line-height:1}
.roll-row{display:flex; flex-direction:column; align-items:center; gap:8px}
.pos-note{font-size:.74rem; color:var(--mat-muted); max-width:22ch}
.die-face.rolling{animation:spin .55s steps(6) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.die-face.rolling{animation:none}}
.progress-line{font-size:.78rem; color:var(--mat-muted)}

.board-legend{display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; font-size:.78rem; color:var(--muted); max-width:640px}
.board-legend span{display:flex; align-items:center; gap:6px}
.board-legend i{width:12px; height:12px; border-radius:4px; flex:none}

@media (max-width:520px){
  .sq .lbl{font-size:.4rem}
  .sq.corner .lbl{font-size:.46rem}
}

/* ================= OVERLAY (module + challenge) ================= */
.overlay-back{position:fixed; inset:0; background:rgba(10,16,15,.55); z-index:40; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:18px 10px 40px}
.overlay-card{background:var(--bg); border-radius:22px; max-width:1080px; width:100%; padding:20px 18px 30px; position:relative; margin-top:10px}
.overlay-close{position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line); background:var(--panel); cursor:pointer; font-size:1.1rem}
.lo-head{padding-right:44px; margin-bottom:6px}
.lo-kicker{font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent)}
.lo-title{font-size:clamp(1.4rem,4vw,1.9rem); font-weight:800; margin-top:2px}
.lo-hook{margin-top:8px; font-size:.94rem; max-width:70ch; background:color-mix(in srgb, var(--accent) 12%, transparent); border-radius:12px; padding:10px 12px}
.lo-goals{list-style:none; margin:14px 0 0; display:flex; flex-direction:column; gap:6px}
.lo-goals li{display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:start; font-size:.9rem}
.lo-goals .box{width:20px; height:20px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.72rem; margin-top:1px; flex:none}
.lo-goals li.done .box{background:var(--good); border-color:var(--good); color:#fff}
.lo-goals li.done .tx{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--good)}
.lo-timerwrap{margin:12px 0 0}
.lo-timerbar{height:12px; border-radius:999px; background:var(--line); overflow:hidden}
.lo-timerbar i{display:block; height:100%; background:var(--atp); transition:width .18s linear}
.lo-timer-txt{font-size:.8rem; color:var(--muted); margin-top:4px}

/* Lab (reused bench UI) */
.lab-wrap{margin-top:16px}
.lab{display:grid; grid-template-columns:290px 1fr; gap:16px; align-items:start}
.panel{background:var(--panel); border:1.5px solid var(--line); border-radius:18px; padding:16px 18px}
h2.pt{font-size:1.1rem; font-weight:600; margin:0 0 10px}
.shelf-list{display:flex; flex-direction:column; gap:8px}
.item{display:grid; grid-template-columns:50px 1fr; align-items:center; gap:10px; text-align:left; width:100%; background:transparent; border:1.5px solid var(--line); border-radius:12px; padding:7px 10px 7px 7px; cursor:pointer}
.item:hover{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent)}
.item:active{transform:translateY(1px)}
.item .ic{display:flex; justify-content:center; align-items:center; line-height:0}
.item .nm{font-weight:600; font-size:.95rem; line-height:1.25; display:block}
.item .ds{font-size:.78rem; color:var(--muted); line-height:1.3; display:block; margin-top:2px}
.shelf-note{font-size:.8rem; color:var(--muted); margin:12px 0 0}
.legend{display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; margin-top:12px; font-size:.78rem; color:var(--muted)}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:50%; border:1.5px solid #1b2422; flex:none}
.seg{display:flex; border:1.5px solid var(--line); border-radius:12px; padding:3px; gap:3px; margin-bottom:12px}
.seg button{flex:1; border:0; border-radius:9px; background:transparent; padding:7px 8px; cursor:pointer; font-weight:500; font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.bench-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; margin-bottom:6px}
.tools{display:flex; flex-wrap:wrap; gap:6px}
.howto{margin:0 0 12px; font-size:.88rem; color:var(--muted)}
.mat{position:relative; background-color:var(--mat); background-image:linear-gradient(var(--mat-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid) 1px,transparent 1px); background-size:24px 24px; border-radius:16px; min-height:300px; padding:18px; overflow:hidden; color:var(--mat-ink)}
.empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--mat-muted); font-size:1rem}
.empty p{max-width:26em; margin:0}
.mols{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start}
.mol{border:2px dashed rgba(255,255,255,.18); border-radius:14px; padding:10px 12px 10px; cursor:pointer; max-width:100%}
.mol.active{border:2px solid var(--accent); background:rgba(255,255,255,.06)}
.chain{display:flex; flex-wrap:wrap; row-gap:10px; align-items:flex-start}
.unit{display:flex; align-items:flex-start}
.tile{display:block; flex:none}
.cap{margin-top:8px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; line-height:1.3}
.cap .nm{font-weight:600; font-size:.92rem}
.cap .kd{font-size:.78rem; color:var(--mat-muted)}
.sel{font-size:.74rem; border:1px solid rgba(255,255,255,.4); background:transparent; color:var(--mat-ink); border-radius:999px; padding:2px 10px; cursor:pointer}
.mol.active .sel{background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:600}
.bond{appearance:none; border:0; background:transparent; width:24px; height:var(--tile-h,64px); position:relative; padding:0; cursor:pointer; flex:none; margin:0 -1px}
.bond::before{content:""; position:absolute; left:-3px; right:-3px; top:calc(var(--bond-y,32px) - 3px); height:6px; background:#f1f5f3; border-radius:3px; border:1px solid #1b2422}
.bond.o::after{content:""; position:absolute; left:50%; top:var(--bond-y,32px); width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; background:#e0463c; border:1.5px solid #1b2422}
.bond:hover::before,.bond:focus-visible::before{background:repeating-linear-gradient(90deg,#ffb4ab 0 4px,#1b2422 4px 6px)}
.bond:focus-visible{outline-offset:0}
.lipid-svg{display:block; width:100%; max-width:560px; height:auto}
.lbond{cursor:pointer}
.lbond:hover .bline,.lbond:focus-visible .bline{stroke:#ffb4ab; stroke-dasharray:5 3}
.lbond:focus-visible{outline:none}
.lbond:focus-visible .bhit{stroke:var(--accent); stroke-width:3}
.hint{min-height:1.5em; margin:10px 2px 0; font-size:.88rem; color:var(--muted)}
.hint.warn{color:var(--warn); background:var(--warn-bg); border-radius:10px; padding:6px 10px}
.selected{margin-top:10px; border-left:4px solid var(--accent); padding:4px 0 4px 14px}
.selected .t{font-weight:600}
.selected .k{color:var(--muted); font-size:.85rem; margin-left:6px}
.selected p{margin:4px 0 0; font-size:.92rem; max-width:62ch}
.selected .sq2{font-size:.88rem; letter-spacing:.02em; margin-top:4px; overflow-wrap:anywhere}
.h2o{position:absolute; pointer-events:none; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.72rem; font-weight:700; color:#fff; z-index:5; text-shadow:0 1px 2px rgba(0,0,0,.5)}
.h2o.out{animation:wout 1.6s ease-out forwards}
.h2o.in{animation:win 1.1s ease-in forwards}
@keyframes wout{0%{opacity:0; transform:translate(-50%,-50%) scale(.3)} 15%{opacity:1; transform:translate(-50%,-60%) scale(1.2)} 100%{opacity:0; transform:translate(-50%,-240%) scale(1)}}
@keyframes win{0%{opacity:0; transform:translate(-50%,-260%) scale(1)} 65%{opacity:1; transform:translate(-50%,-55%) scale(1.1)} 100%{opacity:0; transform:translate(-50%,-50%) scale(.2)}}
@media (prefers-reduced-motion:reduce){.h2o{display:none}.bump{animation:none}}
.lower{display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:16px; margin-top:16px; align-items:start}
.lower.lower-2col{grid-template-columns:1.25fr 1fr}
.ledger{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.chip{display:flex; align-items:center; gap:8px; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:6px 12px 6px 8px}
.chip .n{font-size:1.15rem; font-weight:700; line-height:1; min-width:1.2ch}
.chip .l{font-size:.72rem; color:var(--muted); line-height:1.2; max-width:11em}
.log{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.log li{border-top:1px solid var(--line); padding-top:10px; font-size:.88rem; color:var(--muted)}
.log li:first-child{border-top:0; padding-top:0; color:var(--ink); font-size:1rem}
.log .rx{font-weight:600; display:block; margin-bottom:2px}
.log li:first-child .rx{color:var(--accent); filter:brightness(.8)}
.log .eq{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; line-height:1.35}
.log li:first-child .eq{font-size:1.05rem; font-weight:500}
.log .why{display:block; margin-top:3px; font-size:.84rem; color:var(--muted)}
.wi{display:inline-flex; align-items:center; gap:3px; white-space:nowrap; font-weight:600}
.arrow{font-weight:700; padding:0 2px}
.log-empty{color:var(--muted); font-size:.92rem; margin:0}
.facts dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:.88rem}
.facts dt{font-weight:600; color:var(--muted)}
.facts dd{margin:0}
.factshook{margin:12px 0 0; font-size:.9rem; padding:10px 12px; border-radius:12px; background:color-mix(in srgb, var(--accent) 12%, transparent)}

/* Learn Lab: tabs, challenges list, learning targets, toast (restored from the original prototype) */
.tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin:0 0 16px}
.tab{display:flex; align-items:center; gap:9px; flex:none; border:1.5px solid var(--line); background:var(--panel); border-radius:12px; padding:9px 16px 9px 12px; cursor:pointer; font-weight:500}
.tab svg{flex:none}
.tab[aria-selected="true"]{border-color:var(--accent); box-shadow:inset 0 -4px 0 var(--accent); font-weight:600}
.tab:hover{border-color:var(--accent)}
.toast{display:none; background:var(--good-bg); color:var(--good); border-radius:10px; padding:8px 12px; font-weight:600; font-size:.9rem; margin-bottom:10px}
.toast.show{display:block}
.prog{margin:-4px 0 10px; font-size:.85rem; color:var(--muted)}
.chal{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.chal li{display:grid; grid-template-columns:24px 1fr; gap:10px; align-items:start; font-size:.92rem}
.chal .box{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.8rem; margin-top:1px}
.chal li.done .box{background:var(--good); border-color:var(--good); color:var(--panel)}
.chal li.done .tx{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--good)}
.targets{margin-top:16px}
.targets ul{margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(3,1fr); gap:10px 18px; font-size:.9rem}
.targets li{padding-left:14px; border-left:3px solid var(--line)}
@media (max-width:820px){ .targets ul{grid-template-columns:1fr} }

/* Home screen + shared screen nav */
.home-cards{display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:820px; margin:40px auto}
.home-card{background:var(--panel); border:1.5px solid var(--line); border-radius:22px; padding:32px 24px; text-align:center; cursor:pointer}
.home-card:hover{border-color:var(--accent)}
.home-card .hc-ic{font-size:2.6rem}
.home-card h2{font-size:1.3rem; margin-top:8px}
.home-card p{color:var(--muted); margin-top:8px; font-size:.92rem}
@media (max-width:640px){ .home-cards{grid-template-columns:1fr} }
.scr-nav{display:flex; gap:8px; flex-wrap:wrap}
.navpill{border:1.5px solid var(--line); background:var(--panel); border-radius:999px; padding:.5rem 1rem; cursor:pointer; font-weight:600; font-size:.88rem}
.navpill:hover{border-color:var(--accent)}
.navpill.active{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}

/* Quiz */
.quiz{margin-top:18px; border-top:2px dashed var(--line); padding-top:16px}
.quiz-prog{font-size:.8rem; color:var(--muted); margin-bottom:8px; font-weight:600}
.quiz-q{font-size:1.05rem; font-weight:700; margin-bottom:12px}
.quiz-opts{display:flex; flex-direction:column; gap:8px}
.qopt{text-align:left; border:1.5px solid var(--line); background:var(--panel); border-radius:12px; padding:.7rem .9rem; cursor:pointer; font-size:.94rem}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt.correct{border-color:var(--good); background:var(--good-bg); font-weight:600}
.qopt.wrong{border-color:var(--warn); background:var(--warn-bg)}
.qopt:disabled{cursor:not-allowed}
.quiz-fb{margin-top:12px; font-size:.9rem; padding:10px 12px; border-radius:12px}
.quiz-fb.good{background:var(--good-bg); color:var(--good)}
.quiz-fb.warn{background:var(--warn-bg); color:var(--warn)}
.quiz-next{margin-top:14px}
.module-done{text-align:center; padding:28px 10px}
.module-done .big{font-size:2.4rem}
.module-done h3{font-size:1.5rem; margin-top:8px}
.module-done p{color:var(--muted); margin-top:6px}
.atp-pop{color:var(--atp-ink); font-weight:800; font-size:1.3rem; margin-top:10px}
@media (prefers-color-scheme: dark){.atp-pop{color:var(--atp)}}

/* Popup (small info/confirm) */
.popup-card{max-width:460px}
.popup-emoji{font-size:2.4rem; text-align:center}
.popup-txt{text-align:center; margin-top:8px; font-size:.98rem}
.popup-actions{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap}

@media (max-width:1020px){
  .lower{grid-template-columns:1fr 1fr}
  .lower.lower-2col{grid-template-columns:1fr}
  .lower > .challenges{grid-column:1 / -1}
}
@media (max-width:820px){
  .lab{grid-template-columns:1fr}
  .shelf-list{display:grid; grid-template-columns:1fr 1fr}
  .lower{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:14px 10px 40px}
  .shelf-list{grid-template-columns:1fr}
  .mat{padding:12px; min-height:260px}
  .item .ds{display:none}
  .shelf-list{grid-template-columns:1fr 1fr}
  .overlay-card{padding:16px 12px 24px; border-radius:16px}
}

/* Particle celebration */
.burst{position:fixed; inset:0; pointer-events:none; z-index:60}
.burst i{position:absolute; width:9px; height:9px; border-radius:3px; top:50%; left:50%; animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0}}
</style>

<body data-tab="board">
<div id="app"></div>

<script>
(function(){
'use strict';
const INK = '#1b2422';
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   PART 1: shared macromolecule data + SVG tile builders
   (kept intact from the original MonoPoly lab engine)
============================================================ */
const CARB = {
  glu:{name:'Glucose', code:'Glu', n:6, color:'#f2b441', note:'Blood sugar. The fuel your cells burn in cellular respiration.'},
  fru:{name:'Fructose', code:'Fru', n:5, color:'#ef8a3c', note:'Fruit sugar. The sweetest of the three.'},
  gal:{name:'Galactose', code:'Gal', n:6, color:'#f3dc7a', note:'Found in milk, as half of milk sugar.'}
};
const AACLS = {
  np:{short:'Nonpolar', color:'#c5cdd8'},
  po:{short:'Polar', color:'#93d3a0'},
  pos:{short:'Positive charge', color:'#86b6f0'},
  neg:{short:'Negative charge', color:'#f19187'}
};
const AA = {
  met:{name:'Methionine', code:'Met', cls:'np', note:'Nonpolar. Almost every protein your cells build starts with Met.'},
  gly:{name:'Glycine', code:'Gly', cls:'np', note:'Nonpolar, and the smallest amino acid.'},
  ala:{name:'Alanine', code:'Ala', cls:'np', note:'Nonpolar. Tends to hide inside a folded protein, away from water.'},
  val:{name:'Valine', code:'Val', cls:'np', note:'Nonpolar. Swapping one of these into hemoglobin causes sickle cell disease.'},
  phe:{name:'Phenylalanine', code:'Phe', cls:'np', note:'Nonpolar, with a bulky ring. It is the reason diet soda cans carry a PKU warning.'},
  ser:{name:'Serine', code:'Ser', cls:'po', note:'Polar. Gets along with water, so it often sits on a protein’s surface.'},
  cys:{name:'Cysteine', code:'Cys', cls:'po', note:'Polar. Two cysteines can link with a sulfur bridge that locks a protein’s shape.'},
  lys:{name:'Lysine', code:'Lys', cls:'pos', note:'Positively charged side chain. Attracted to negative charges.'},
  glu:{name:'Glutamic acid', code:'Glu', cls:'neg', note:'Negatively charged side chain. It is the “glutamate” in MSG.'}
};
const BASES = {
  A:{name:'Adenine', color:'#ec6f62'},
  T:{name:'Thymine', color:'#f2c94c'},
  G:{name:'Guanine', color:'#5cbf73'},
  C:{name:'Cytosine', color:'#6b9ce8'},
  U:{name:'Uracil', color:'#b08ae0'}
};
const PAIR = {A:'T', T:'A', G:'C', C:'G'};
const HB = {A:2, T:2, G:3, C:3};
const LIPID_PARTS = {
  glycerol:{name:'Glycerol', note:'The 3-carbon backbone. Always goes on first.'},
  sat:{name:'Saturated fatty acid', note:'Straight tail. Every carbon holds all the hydrogen it can.'},
  unsat:{name:'Unsaturated fatty acid', note:'A double bond puts a kink in the tail.'},
  phos:{name:'Phosphate group', note:'Only bonds to carbon 3. Makes a water-loving head.'}
};

const TABS = {
  carbs:{label:'Carbohydrates', shelf:'Monomer shelf', bond:'glycosidic bond', bondY:33, tileH:64,
    howto:'Tap a sugar to bond it onto the selected molecule. Tap any bond to break it with water.'},
  proteins:{label:'Proteins', shelf:'Monomer shelf', bond:'peptide bond', bondY:32, tileH:64,
    howto:'Tap an amino acid to bond it onto the end of the selected chain. Tap any bond to break it with water.'},
  lipids:{label:'Lipids', shelf:'Parts shelf', bond:'ester bond',
    howto:'Put down glycerol first, then attach fatty acids or a phosphate. Tap any bond to break it with water.'},
  nucleic:{label:'Nucleic acids', shelf:'Monomer shelf', bond:'phosphodiester bond', bondY:30, tileH:86,
    howto:'Pick DNA or RNA, then tap bases to add nucleotides to the strand. Tap any bond in the backbone to break it with water.'}
};

const FACTS = {
  carbs:{rows:[['Monomer','Monosaccharide (simple sugar), like glucose'],['Polymer','Polysaccharide, like starch, glycogen, or cellulose'],['Bond','Glycosidic bond'],['Job','Quick energy, short-term energy storage, plant structure'],['Elements','C, H, O']],
    hook:'Chew a plain cracker long enough and it starts tasting sweet. An enzyme in your saliva is running hydrolysis on the starch and snipping off maltose.'},
  proteins:{rows:[['Monomer','Amino acid (20 kinds)'],['Polymer','Polypeptide, which folds into a protein'],['Bond','Peptide bond'],['Job','Enzymes, muscle, antibodies, transport, signals'],['Elements','C, H, O, N (some S)']],
    hook:'Twenty amino acids can make endless proteins, the way 26 letters make endless words. Change the order and you change the shape, and the shape decides the job.'},
  lipids:{rows:[['Building blocks','Glycerol + fatty acids'],['A polymer?','Not really. Lipids are not long chains of one repeating monomer.'],['Bond','Ester bond'],['Job','Long-term energy storage, insulation, cell membranes, some hormones'],['Elements','C, H, O (plus P in phospholipids)']],
    hook:'Butter sits in a stick and olive oil pours. Same basic build, but straight tails pack tightly and kinked tails can’t.'},
  nucleic:{rows:[['Monomer','Nucleotide: phosphate + 5-carbon sugar + nitrogen base'],['Polymer','DNA and RNA'],['Bond','Phosphodiester bond (the sugar-phosphate backbone)'],['Job','Store and pass on genetic instructions, and help build proteins'],['Elements','C, H, O, N, P']],
    hook:'DNA uses deoxyribose sugar and thymine. RNA uses ribose sugar and swaps thymine for uracil.'}
};

/* ---------- naming ---------- */
function nameCarb(u){
  const n = u.length;
  if(n === 1){ const m = CARB[u[0]]; return {name:m.name, kind:'Monosaccharide', note:m.note, eq:m.name}; }
  if(n === 2){
    const k = [...u].sort().join('+');
    const map = {
      'glu+glu':['Maltose','Malt sugar. It shows up when your saliva starts digesting starch.'],
      'fru+glu':['Sucrose','Table sugar, from sugar cane and sugar beets.'],
      'gal+glu':['Lactose','Milk sugar. People who are lactose intolerant are short on lactase, the enzyme that runs hydrolysis on this bond.']
    };
    if(map[k]) return {name:map[k][0], kind:'Disaccharide', note:map[k][1], eq:map[k][0]};
    return {name:'Disaccharide', kind:'Two sugars', note:'Two sugars joined by one glycosidic bond.', eq:'Disaccharide'};
  }
  if(u.every(x => x === 'glu')) return {name:'Polysaccharide', kind:n + ' glucose', note:'A glucose chain. Starch (plants), glycogen (your liver and muscles), and cellulose (plant cell walls) are all built from glucose. The real ones run thousands long.', eq:'Polysaccharide (' + n + ' glucose)'};
  return {name:'Polysaccharide', kind:n + ' mixed sugars', note:'A mixed sugar chain.', eq:'Polysaccharide (' + n + ' sugars)'};
}
function nameProt(u){
  const n = u.length, seq = u.map(k => AA[k].code).join('–');
  if(n === 1){ const a = AA[u[0]]; return {name:a.name, kind:'Amino acid', note:a.note, eq:a.name}; }
  if(n === 2) return {name:'Dipeptide', kind:'2 amino acids', note:'Two amino acids joined by one peptide bond.', seq, eq:'Dipeptide (' + seq + ')'};
  return {name:'Polypeptide', kind:n + ' amino acids', seq, eq:'Polypeptide (' + n + ' amino acids)',
    note: n >= 8 ? 'Long enough to start folding. Real proteins run from about 50 to thousands of amino acids, and the order decides the final shape.' : 'A short chain. The order of the amino acids will decide how the finished protein folds.'};
}
function nameNuc(u){
  const n = u.length, s = u[0].s;
  if(n === 1){
    const B = BASES[u[0].b];
    return {name:B.name + ' nucleotide', kind:s + ' nucleotide', note:'Phosphate + ' + (s === 'DNA' ? 'deoxyribose' : 'ribose') + ' + ' + B.name.toLowerCase() + '. Every nucleotide has the same three parts.', eq:B.name + ' nucleotide'};
  }
  const seq = u.map(x => x.b).join('');
  return {name:s + ' strand', kind:n + ' nucleotides', seq:'5′-' + seq + '-3′', eq:s + ' strand (' + n + ' nucleotides)',
    note: s === 'DNA' ? 'One strand of DNA. Real DNA pairs two strands into a double helix. Try showing the matching strand.' : 'A strand of RNA. RNA is usually single-stranded and carries a working copy of a gene.'};
}
function describe(tab, u){ return tab === 'carbs' ? nameCarb(u) : tab === 'proteins' ? nameProt(u) : nameNuc(u); }
function monoName(tab, unit){
  if(tab === 'carbs') return CARB[unit].name;
  if(tab === 'proteins') return AA[unit].name;
  return BASES[unit.b].name + ' nucleotide';
}
function nameLipid(L){
  if(!L.glycerol) return null;
  const fa = L.slots.filter(s => s === 'sat' || s === 'unsat');
  const p = L.slots.includes('phos');
  if(!fa.length && !p) return {name:'Glycerol', kind:'Backbone', note:'A 3-carbon backbone. Each carbon has a spot where a fatty acid can bond.', eq:'Glycerol'};
  if(p){
    if(fa.length === 2) return {name:'Phospholipid', kind:'Membrane lipid', note:'A water-loving phosphate head with two water-fearing tails. Two layers of these, tails tucked inward, make every cell membrane.', eq:'Phospholipid', phospho:true};
    return {name:'Unfinished phospholipid', kind:fa.length + ' tail' + (fa.length === 1 ? '' : 's'), note:'A phospholipid needs two fatty acid tails plus the phosphate.', eq:'Unfinished phospholipid'};
  }
  if(fa.length === 1) return {name:'Monoglyceride', kind:'1 fatty acid', note:'Glycerol with one tail. Two spots still open.', eq:'Monoglyceride'};
  if(fa.length === 2) return {name:'Diglyceride', kind:'2 fatty acids', note:'Glycerol with two tails. One spot still open.', eq:'Diglyceride'};
  if(fa.every(x => x === 'sat')) return {name:'Saturated fat', kind:'Triglyceride', note:'Straight tails stack tightly, so it’s solid at room temperature. Think butter or lard.', eq:'Triglyceride (saturated fat)'};
  if(fa.every(x => x === 'unsat')) return {name:'Unsaturated fat (oil)', kind:'Triglyceride', note:'Kinked tails can’t pack tightly, so it stays liquid at room temperature. Think olive or canola oil.', eq:'Triglyceride (oil)'};
  return {name:'Mixed triglyceride', kind:'Triglyceride', note:'Most real fats are a blend of saturated and unsaturated tails.', eq:'Triglyceride (mixed)'};
}
const anyMol = (T, f) => T.mols.some(m => f(m.units));

/* ---------- SVG builders ---------- */
function polyPts(cx, cy, r, n, rot){
  const p = [];
  for(let k = 0; k < n; k++){ const a = (rot + 360 / n * k) * Math.PI / 180; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return p;
}
const ptsStr = P => P.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
function waterSVG(w){
  w = w || 34; const h = Math.round(w * 30 / 40);
  return '<svg viewBox="0 0 40 30" width="' + w + '" height="' + h + '" aria-hidden="true">' +
    '<line x1="20" y1="12" x2="9" y2="22" stroke="' + INK + '" stroke-width="2.4"/>' +
    '<line x1="20" y1="12" x2="31" y2="22" stroke="' + INK + '" stroke-width="2.4"/>' +
    '<circle cx="9" cy="22" r="6" fill="#fff" stroke="' + INK + '" stroke-width="2"/>' +
    '<circle cx="31" cy="22" r="6" fill="#fff" stroke="' + INK + '" stroke-width="2"/>' +
    '<circle cx="20" cy="12" r="9.5" fill="#e0463c" stroke="' + INK + '" stroke-width="2"/>' +
    '<ellipse cx="16.5" cy="8.5" rx="3.4" ry="2" fill="#fff" opacity=".55"/></svg>';
}
function carbTile(id, size){
  size = size || 64;
  const m = CARB[id], P = polyPts(32, 33, 25, m.n, -90), o = P[1];
  return '<svg class="tile" viewBox="0 0 64 64" width="' + size + '" height="' + size + '" aria-hidden="true">' +
    '<polygon points="' + ptsStr(P) + '" fill="' + m.color + '" stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round"/>' +
    '<ellipse cx="23" cy="23" rx="8" ry="4" fill="#fff" opacity=".45"/>' +
    '<circle cx="' + o[0].toFixed(1) + '" cy="' + o[1].toFixed(1) + '" r="6.5" fill="#e0463c" stroke="' + INK + '" stroke-width="1.8"/>' +
    '<text x="' + o[0].toFixed(1) + '" y="' + (o[1] + 3).toFixed(1) + '" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">O</text>' +
    '<text x="32" y="39" text-anchor="middle" font-size="13" font-weight="600" fill="' + INK + '">' + m.code + '</text></svg>';
}
function aaTile(id, size){
  size = size || 64;
  const a = AA[id], c = AACLS[a.cls];
  const charge = a.cls === 'pos' ? '+' : a.cls === 'neg' ? '−' : '';
  return '<svg class="tile" viewBox="0 0 64 64" width="' + size + '" height="' + size + '" aria-hidden="true">' +
    '<circle cx="32" cy="32" r="25" fill="' + c.color + '" stroke="' + INK + '" stroke-width="2.5"/>' +
    '<ellipse cx="23" cy="20" rx="8" ry="4.5" fill="#fff" opacity=".45"/>' +
    (charge ? '<circle cx="50" cy="13" r="8" fill="#fff" stroke="' + INK + '" stroke-width="1.8"/><text x="50" y="17.5" text-anchor="middle" font-size="13" font-weight="700" fill="' + INK + '">' + charge + '</text>' : '') +
    '<text x="32" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="' + INK + '">' + a.code + '</text></svg>';
}
function nucTile(unit, comp, w){
  const h = comp ? 134 : 86;
  w = w || 60;
  const B = BASES[unit.b];
  const sugarFill = unit.s === 'DNA' ? '#c9d4f5' : '#efc9e9';
  const P = polyPts(39, 31, 15, 5, -90);
  let s = '<svg class="tile" viewBox="0 0 60 ' + h + '" width="' + w + '" height="' + Math.round(h * w / 60) + '" aria-hidden="true">' +
    '<line x1="20" y1="30" x2="27" y2="30" stroke="' + INK + '" stroke-width="2.4"/>' +
    '<line x1="39" y1="45" x2="39" y2="55" stroke="' + INK + '" stroke-width="2.4"/>' +
    '<circle cx="12" cy="30" r="10" fill="#f2c14e" stroke="' + INK + '" stroke-width="2.2"/>' +
    '<text x="12" y="34.5" text-anchor="middle" font-size="11" font-weight="700" fill="' + INK + '">P</text>' +
    '<polygon points="' + ptsStr(P) + '" fill="' + sugarFill + '" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="round"/>' +
    '<text x="39" y="35" text-anchor="middle" font-size="10" font-weight="600" fill="' + INK + '">' + (unit.s === 'DNA' ? 'dR' : 'R') + '</text>' +
    '<rect x="25" y="55" width="28" height="28" rx="6" fill="' + B.color + '" stroke="' + INK + '" stroke-width="2.2"/>' +
    '<ellipse cx="32" cy="61" rx="5" ry="2.5" fill="#fff" opacity=".45"/>' +
    '<text x="39" y="74.5" text-anchor="middle" font-size="15" font-weight="700" fill="' + INK + '">' + unit.b + '</text>';
  if(comp && unit.s === 'DNA'){
    const pb = PAIR[unit.b], n = HB[unit.b], PB = BASES[pb];
    const xs = n === 2 ? [34, 44] : [31, 39, 47];
    xs.forEach(x => { s += '<line x1="' + x + '" y1="86" x2="' + x + '" y2="101" stroke="#e8f3ef" stroke-width="2" stroke-dasharray="3 3"/>'; });
    s += '<rect x="25" y="103" width="28" height="28" rx="6" fill="' + PB.color + '" stroke="' + INK + '" stroke-width="2.2"/>' +
      '<text x="39" y="122.5" text-anchor="middle" font-size="15" font-weight="700" fill="' + INK + '">' + pb + '</text>';
  }
  return s + '</svg>';
}
function zigzag(x0, y0, kink){
  const pts = [[x0, y0]]; let bx = x0, by = y0, ang = 0, kinkSeg = -1;
  const step = 17, amp = 7, N = 14;
  for(let i = 0; i < N; i++){
    if(kink && i === 8){ ang = 0.42; kinkSeg = i; }
    bx += step * Math.cos(ang); by += step * Math.sin(ang);
    const off = i % 2 === 0 ? -amp : amp;
    pts.push([bx - Math.sin(ang) * off, by + Math.cos(ang) * off]);
  }
  return {pts, kinkSeg};
}
function tailSVG(x, y, kink){
  const z = zigzag(x, y, kink);
  let s = '<polyline points="' + ptsStr(z.pts) + '" fill="none" stroke="#f5f0dc" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
  if(kink){
    const a = z.pts[z.kinkSeg], b = z.pts[z.kinkSeg + 1];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), nx = -dy / L * 6, ny = dx / L * 6;
    const t1 = 0.2, t2 = 0.8;
    s += '<line x1="' + (a[0] + dx * t1 + nx).toFixed(1) + '" y1="' + (a[1] + dy * t1 + ny).toFixed(1) + '" x2="' + (a[0] + dx * t2 + nx).toFixed(1) + '" y2="' + (a[1] + dy * t2 + ny).toFixed(1) + '" stroke="#ffb74a" stroke-width="3" stroke-linecap="round"/>';
  }
  return s;
}
function lipidMini(kind){
  const open = '<svg viewBox="0 0 60 40" width="48" height="32" aria-hidden="true">';
  if(kind === 'glycerol') return open + '<rect x="18" y="2" width="24" height="36" rx="7" fill="#e9e2cf" stroke="' + INK + '" stroke-width="2"/>' +
    [10, 20, 30].map(y => '<circle cx="30" cy="' + y + '" r="3.6" fill="#3c4644"/>').join('') + '</svg>';
  if(kind === 'phos') return open + '<line x1="8" y1="20" x2="44" y2="20" stroke="' + INK + '" stroke-width="2"/><circle cx="22" cy="20" r="10" fill="#f2c14e" stroke="' + INK + '" stroke-width="2"/><text x="22" y="24.5" text-anchor="middle" font-size="11" font-weight="700" fill="' + INK + '">P</text><circle cx="46" cy="20" r="8" fill="#8fd0e6" stroke="' + INK + '" stroke-width="2"/></svg>';
  const kink = kind === 'unsat';
  let pts = [], bx = 4, by = 14, ang = 0;
  pts.push([bx, by]);
  for(let i = 0; i < 8; i++){
    if(kink && i === 4) ang = 0.55;
    bx += 7 * Math.cos(ang); by += 7 * Math.sin(ang);
    const off = i % 2 === 0 ? -4 : 4;
    pts.push([bx - Math.sin(ang) * off, by + Math.cos(ang) * off]);
  }
  return open + '<rect x="0" y="0" width="60" height="40" rx="8" fill="#1f5a52"/><polyline points="' + ptsStr(pts) + '" fill="none" stroke="#f5f0dc" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function lipidSVG(L, d){
  const rows = [48, 128, 208], W = 460, H = 262;
  let s = '<svg class="lipid-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (d ? d.name : 'Empty') + '">';
  s += '<rect x="16" y="16" width="72" height="224" rx="18" fill="#e9e2cf" stroke="' + INK + '" stroke-width="2.5"/>';
  s += '<text x="52" y="256" text-anchor="middle" font-size="12" fill="#acd0c7">glycerol</text>';
  rows.forEach((y, i) => {
    const piece = L.slots[i];
    if(!piece){
      s += '<rect x="104" y="' + (y - 20) + '" width="300" height="40" rx="12" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5" stroke-dasharray="6 6"/>' +
        '<text x="122" y="' + (y + 5) + '" font-size="13" fill="#acd0c7">Carbon ' + (i + 1) + ' is open: ' + (i === 2 ? 'fatty acid or phosphate' : 'fatty acid') + '</text>';
    } else {
      const pname = piece === 'phos' ? 'phosphate group' : (piece === 'sat' ? 'saturated fatty acid' : 'unsaturated fatty acid');
      s += '<g class="lbond" data-lbond="' + i + '" tabindex="0" role="button" aria-label="Break the ester bond holding the ' + pname + ' on carbon ' + (i + 1) + '">' +
        '<rect class="bhit" x="70" y="' + (y - 16) + '" width="62" height="32" rx="8" fill="transparent"/>' +
        '<line class="bline" x1="68" y1="' + y + '" x2="130" y2="' + y + '" stroke="#f1f5f3" stroke-width="5" stroke-linecap="round"/>' +
        '<circle cx="100" cy="' + y + '" r="7.5" fill="#e0463c" stroke="' + INK + '" stroke-width="1.8"/>' +
        '<text x="100" y="' + (y + 3.2) + '" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">O</text></g>';
      if(piece === 'phos'){
        s += '<line x1="130" y1="' + y + '" x2="186" y2="' + y + '" stroke="#f1f5f3" stroke-width="4"/>' +
          '<circle cx="150" cy="' + y + '" r="16" fill="#f2c14e" stroke="' + INK + '" stroke-width="2.4"/>' +
          '<text x="150" y="' + (y + 5) + '" text-anchor="middle" font-size="14" font-weight="700" fill="' + INK + '">P</text>' +
          '<circle cx="200" cy="' + y + '" r="14" fill="#8fd0e6" stroke="' + INK + '" stroke-width="2.4"/>' +
          '<text x="236" y="' + (y + 5) + '" font-size="12" fill="#e8f3ef">phosphate group</text>';
      } else {
        s += tailSVG(130, y, piece === 'unsat');

let UID = 1; const uid = () => 'm' + (UID++);
function freshTabs(){
  return {
    carbs:{mols:[], active:null, log:[]},
    proteins:{mols:[], active:null, log:[]},
    lipids:{glycerol:false, slots:[null,null,null], wasTri:false, log:[]},
    nucleic:{mols:[], active:null, log:[], mode:'DNA', complement:false}
  };
}
const LAB = { tab:'carbs', tabs: freshTabs(), water:{released:0, used:0}, active:false, onGoalProgress:null };

function pushLog(e){ const T = LAB.tabs[LAB.tab]; T.log.unshift(e); if(T.log.length > 12) T.log.pop(); }
function bump(id){ const el = $(id); if(!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function centerOf(el){
  if(!el) return null;
  const matEl = $('mat'); if(!matEl) return null;
  const m = matEl.getBoundingClientRect(), r = el.getBoundingClientRect();
  let cy = r.top + r.height / 2;
  if(el.classList && el.classList.contains('bond')){
    const by = parseFloat(getComputedStyle(el).getPropertyValue('--bond-y')) || r.height / 2;
    cy = r.top + by;
  }
  return {x:r.left + r.width / 2 - m.left, y:cy - m.top};
}
function spawnWater(pos, dir, delay){
  if(!pos || reduceMotion) return;
  setTimeout(() => {
    const matEl = $('mat'); if(!matEl) return;
    const w = document.createElement('div');
    w.className = 'h2o ' + dir;
    w.style.left = pos.x + 'px'; w.style.top = pos.y + 'px';
    w.innerHTML = waterSVG(38) + '<span>H₂O</span>';
    matEl.appendChild(w);
    setTimeout(() => w.remove(), 1800);
  }, delay || 0);
}

/* ---------- actions: linear polymers (carbs / proteins / nucleic) ---------- */
function addLinear(key){
  const t = LAB.tab, T = LAB.tabs[t];
  const unit = t === 'nucleic' ? {b:key, s:T.mode} : key;
  let mol = T.mols.find(m => m.id === T.active);
  if(!mol){
    if(T.mols.length >= 6){ warnLab('The bench holds 6 molecules. Remove one or clear the bench to make room.'); return; }
    mol = {id:uid(), units:[unit]}; T.mols.push(mol); T.active = mol.id;
    renderLab(); afterAction({type:'place'}); return;
  }
  if(t === 'nucleic' && mol.units[0].s !== unit.s){ warnLab('DNA and RNA nucleotides don’t mix in one strand. Tap “Start a new molecule” first.'); return; }
  if(mol.units.length >= 12){ warnLab('That chain hit the bench limit of 12. Start a new molecule to keep building.'); return; }
  const before = describe(t, mol.units).eq;
  mol.units.push(unit);
  const after = describe(t, mol.units).eq;
  LAB.water.released++;
  pushLog({type:'syn', left:[before, monoName(t, unit)], right:[after], n:1});
  renderLab(); bump('chipOut'); playSfx('build');
  spawnWater(centerOf(document.querySelector('[data-bond="' + mol.id + '-' + (mol.units.length - 2) + '"]')), 'out');
  afterAction({type:'syn'});
}
function breakBond(molId, i){
  const t = LAB.tab, T = LAB.tabs[t];
  const idx = T.mols.findIndex(m => m.id === molId); if(idx < 0) return;
  const mol = T.mols[idx];
  const pos = centerOf(document.querySelector('[data-bond="' + molId + '-' + i + '"]'));
  const len = mol.units.length;
  const before = describe(t, mol.units).eq;
  const left = mol.units.slice(0, i + 1), right = mol.units.slice(i + 1);
  if(T.mols.length >= 10){ warnLab('The bench is crowded. Remove a molecule before breaking more apart.'); return; }
  mol.units = left;
  T.mols.splice(idx + 1, 0, {id:uid(), units:right});
  LAB.water.used++;
  pushLog({type:'hyd', left:[before], right:[describe(t, left).eq, describe(t, right).eq], n:1});
  renderLab(); bump('chipIn'); spawnWater(pos, 'in'); playSfx('break');
  afterAction({type:'hyd', len});
}
function breakAllLinear(){
  const t = LAB.tab, T = LAB.tabs[t];
  const idx = T.mols.findIndex(m => m.id === T.active); if(idx < 0) return;
  const mol = T.mols[idx], n = mol.units.length - 1; if(n < 1) return;
  if(T.mols.length + n > 16){ warnLab('Breaking every bond would overflow the bench. Remove a molecule first.'); return; }
  const positions = [];
  for(let i = 0; i < n; i++) positions.push(centerOf(document.querySelector('[data-bond="' + mol.id + '-' + i + '"]')));
  const before = describe(t, mol.units).eq;
  const len = mol.units.length;
  const pieces = mol.units.map(u => ({id:uid(), units:[u]}));
  T.mols.splice(idx, 1, ...pieces);
  T.active = pieces[0].id;
  LAB.water.used += n;
  const names = mol.units.map(u => monoName(t, u));
  pushLog({type:'hyd', left:[before], right:names.length > 4 ? [names.length + ' monomers'] : names, n});
  renderLab(); bump('chipIn'); playSfx('break');
  positions.forEach((p, k) => spawnWater(p, 'in', k * 110));
  afterAction({type:'hyd', len});
}

/* ---------- actions: lipids ---------- */
function addLipid(key){
  const L = LAB.tabs.lipids;
  if(key === 'glycerol'){
    if(L.glycerol){ warnLab('One glycerol at a time. Clear the bench to start a new lipid.'); return; }
    L.glycerol = true; renderLab(); afterAction({type:'place'}); return;
  }
  if(!L.glycerol){ warnLab('Start with a glycerol backbone. Fatty acids and phosphates need something to bond to.'); return; }
  let slot;
  if(key === 'phos'){
    if(L.slots[2]){ warnLab('Carbon 3 is taken, and phosphate only bonds to carbon 3. Break that bond first.'); return; }
    slot = 2;
  } else {
    slot = L.slots.findIndex(s => !s);
    if(slot < 0){ warnLab('All three carbons are bonded. Break a bond to swap a piece.'); return; }
  }
  const before = nameLipid(L).eq;
  L.slots[slot] = key;
  const after = nameLipid(L);
  if(L.slots.filter(s => s === 'sat' || s === 'unsat').length === 3) L.wasTri = true;
  LAB.water.released++;
  pushLog({type:'syn', left:[before, LIPID_PARTS[key].name], right:[after.eq], n:1});
  renderLab(); bump('chipOut'); playSfx('build');
  spawnWater(centerOf(document.querySelector('[data-lbond="' + slot + '"] circle')), 'out');
  afterAction({type:'syn'});
}
function breakLipid(i){
  const L = LAB.tabs.lipids; if(!L.slots[i]) return;
  const pos = centerOf(document.querySelector('[data-lbond="' + i + '"] circle'));
  const before = nameLipid(L).eq, piece = L.slots[i];
  L.slots[i] = null;
  LAB.water.used++;
  pushLog({type:'hyd', left:[before], right:[nameLipid(L).eq, LIPID_PARTS[piece].name], n:1});
  renderLab(); bump('chipIn'); spawnWater(pos, 'in'); playSfx('break');
  lipidDigestCheck();
}
function breakAllLipid(){
  const L = LAB.tabs.lipids;
  const filled = L.slots.map((s, i) => s ? i : -1).filter(i => i >= 0); if(!filled.length) return;
  const positions = filled.map(i => centerOf(document.querySelector('[data-lbond="' + i + '"] circle')));
  const before = nameLipid(L).eq, parts = filled.map(i => LIPID_PARTS[L.slots[i]].name);
  L.slots = [null, null, null];
  LAB.water.used += filled.length;
  pushLog({type:'hyd', left:[before], right:['Glycerol'].concat(parts), n:filled.length});
  renderLab(); bump('chipIn'); playSfx('break');
  positions.forEach((p, k) => spawnWater(p, 'in', k * 110));
  lipidDigestCheck();
}
function lipidDigestCheck(){
  const L = LAB.tabs.lipids;
  if(L.wasTri && !L.slots.some(Boolean)){ L.wasTri = false; afterAction({type:'digestedTri'}); }
  else afterAction({type:'hyd'});
}
function afterAction(ev){ if(typeof LAB.onGoalProgress === 'function') LAB.onGoalProgress(ev); }

const SAVE_KEY = 'monopoly_bioquest_v1';
const SOUND_KEY = 'monopoly_bioquest_sound';

function loadStore(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : {players:{}, current:null};
  }catch(e){ return {players:{}, current:null}; }
}
function saveStore(store){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(store)); }catch(e){ /* private mode / storage full — progress just won't persist */ }
}
function loadSoundPref(){
  try{ return localStorage.getItem(SOUND_KEY) === '1'; }catch(e){ return false; }
}
function saveSoundPref(on){
  try{ localStorage.setItem(SOUND_KEY, on ? '1' : '0'); }catch(e){}
}

function normalizePlayer(p){
  // Migration: fills in fields added after a player's save was first created.
  // Never touches atp/owned/pos/etc — existing progress is preserved as-is.
  p.goalsDone = p.goalsDone || {};

/* ---------- sound (WebAudio synth, no audio files, off by default) ---------- */
let audioCtx = null;
function ensureAudio(){
  if(audioCtx) return audioCtx;
  try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  return audioCtx;
}
function tone(freq, start, dur, type, gain){
  const ctx = ensureAudio(); if(!ctx) return;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = type || 'sine'; osc.frequency.value = freq;
  g.gain.value = 0;
  osc.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function playSfx(kind){
  if(!SOUND_ON) return;
  if(kind === 'build') tone(520, 0, .12, 'sine');
  else if(kind === 'break') tone(220, 0, .14, 'sawtooth', .08);
  else if(kind === 'dice') tone(300, 0, .08, 'square', .07);
  else if(kind === 'move') tone(440, 0, .05, 'square', .05);
  else if(kind === 'atp'){ tone(660, 0, .09, 'sine'); tone(880, .07, .12, 'sine'); }
  else if(kind === 'correct'){ tone(523, 0, .1, 'sine'); tone(784, .09, .16, 'sine'); }
  else if(kind === 'wrong') tone(160, 0, .22, 'sawtooth', .09);
  else if(kind === 'buy'){ tone(523, 0, .1, 'sine'); tone(659, .09, .1, 'sine'); tone(784, .18, .22, 'sine'); }
  else if(kind === 'open') tone(392, 0, .08, 'triangle', .06);
}

/* ---------- dice + movement ---------- */
function rollDice(){
  if(UI.rolling || UI.overlay || UI.popup) return;
  UI.rolling = true;
  const btn = $('rollBtn'); if(btn) btn.disabled = true;
  const face = $('dieFace');
  playSfx('dice');
  const finalRoll = 1 + Math.floor(Math.random() * 6);
  if(reduceMotion){ settleDie(finalRoll); return; }
  if(face) face.classList.add('rolling');
  let ticks = 0;
  const spin = setInterval(() => {
    if(face) face.textContent = DICE_FACES[Math.floor(Math.random()*6)];
    ticks++;
    if(ticks > 9){ clearInterval(spin); if(face) face.classList.remove('rolling'); settleDie(finalRoll); }
  }, 60);
}
function settleDie(roll){
  const face = $('dieFace'); if(face) face.textContent = DICE_FACES[roll-1];
  PLAYER.lastRoll = roll;
  stepToken(roll, 0);
}
function stepToken(remaining, passedGo){
  if(remaining <= 0){ UI.rolling = false; const btn = $('rollBtn'); if(btn) btn.disabled = false; landOn(PLAYER.pos, passedGo); return; }
  const next = (PLAYER.pos + 1) % SQUARES.length;
  if(next === 0) passedGo++;
  PLAYER.pos = next;
  playSfx('move');
  if(reduceMotion){ placeToken(); stepToken(remaining - 1, passedGo); return; }
  placeToken();
  setTimeout(() => stepToken(remaining - 1, passedGo), 160);
}
function landOn(idx, passedGo){
  const sq = SQUARES[idx];
  if(passedGo > 0) awardATP(CFG.ATP_PASS_GO * passedGo);
  persist();
  if(sq.type === 'go'){ awardATP(CFG.ATP_LAND_GO_BONUS); persist(); renderApp();
    openPopup({emoji:'⚡', title:'Welcome to the ATP Hub!', body:'Landing right on GO powers you up with a bonus, on top of anything you earned passing it.', atp:CFG.ATP_LAND_GO_BONUS, actions:[{label:'Keep rolling', act:'closePopup'}]}); return; }
  if(sq.type === 'prop'){ openModule(sq.id); return; }
  if(sq.type === 'enzyme'){ openChallenge(sq.id); return; }
  if(sq.type === 'jail'){ openDenature(); return; }
  if(sq.type === 'park'){ openWaterBreak(); return; }
  if(sq.type === 'bonus'){ openCornerBonus(); return; }
  renderApp();
}

function refreshModuleGoals(){
  const o = UI.overlay; if(!o || o.mode !== 'module') return;
  const mod = MODULES[o.squareId], T = LAB.tabs[mod.tab];
  const arr = PLAYER.goalsDone[o.squareId];
  let changed = false;
  mod.goals.forEach((g,i) => {
    if(!arr[i] && g.test(T)){ arr[i] = true; changed = true; awardATP(CFG.ATP_GOAL_STEP); }
  });
  if(changed) persist();
  const list = $('loGoals');
  if(list) list.innerHTML = mod.goals.map((g,i) =>
    '<li class="' + (arr[i] ? 'done' : '') + '"><span class="box">' + (arr[i] ? '✓' : '') + '</span><span class="tx">' + esc(g.text) + '</span></li>'
  ).join('');

    const qb = $('quizBlock');
    if(qb && qb.classList.contains('hidden')){
      qb.classList.remove('hidden');
      const doneArr = PLAYER.quizDone[o.squareId];

function celebrate(){
  if(reduceMotion) return;
  const b = document.createElement('div'); b.className = 'burst';
  const colors = ['#e8a33d','#d94f6a','#c2b12c','#5a7fe0','#f2c14e'];
  for(let i=0;i<16;i++){
    const s = document.createElement('i');
    const ang = Math.random()*Math.PI*2, dist = 80+Math.random()*140;
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    s.style.setProperty('--rot', (Math.random()*360)+'deg');
    s.style.background = colors[i%colors.length];
    s.style.left = '50%'; s.style.top = '30%';
    b.appendChild(s);
  }
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 1000);
}

/* ---------- enzyme challenge ---------- */
function openChallenge(squareId){
  const sq = SQUARES.find(s=>s.id===squareId);
  const pool = ENZYME_POOL[sq.group];
  const challenge = pool[Math.floor(Math.random()*pool.length)];
  UI.overlay = {mode:'challenge', squareId, tab:sq.group, challenge, resolved:false};
  renderApp();
}
function mountChallengeDom(){
  const o = UI.overlay;
  LAB.tab = o.tab; renderLab(); playSfx('open');
  o.logLenStart = LAB.tabs[o.tab].log.length;
  o.startComplement = LAB.tabs.nucleic.complement;
  LAB.onGoalProgress = checkChallengeWin;
  clearInterval(challengeInterval);
  const ms = effectiveEnzymeMs();
  o.enzymeMs = ms;
  if(ms === null){ o.deadline = null; return; } // timers Off: no countdown, no auto-fail
  o.deadline = Date.now() + ms;
  challengeInterval = setInterval(tickChallenge, 120);
  tickChallenge();
}
function tickChallenge(){
  const o = UI.overlay; if(!o || o.mode !== 'challenge' || o.resolved || o.deadline === null) return;
  const left = o.deadline - Date.now();
  const pct = Math.max(0, Math.min(100, left / o.enzymeMs * 100));
  const bar = $('chTimerBar'), txt = $('chTimerTxt');
  if(bar) bar.style.width = pct + '%';
  if(txt) txt.textContent = Math.max(0, Math.ceil(left/1000)) + 's left';
  if(left <= 0) resolveChallenge(false);
}
function checkChallengeWin(){
  const o = UI.overlay; if(!o || o.mode !== 'challenge' || o.resolved) return;
  const T = LAB.tabs[o.tab];
  const newest = T.log.length > o.logLenStart ? T.log[0] : null;
  const toggled = T.complement === true && o.startComplement !== true;
  if(o.challenge.test(newest, T, toggled)) resolveChallenge(true);
}
function resolveChallenge(won){
  const o = UI.overlay; if(!o || o.resolved) return;
  o.resolved = true;
  clearInterval(challengeInterval);
  const gained = won ? CFG.ATP_ENZYME_WIN : CFG.ATP_ENZYME_LOSE;
  awardATP(gained); persist();
  playSfx(won ? 'buy' : 'wrong');
  if(won && !reduceMotion) celebrate();
  closeOverlay();
  openPopup({
    emoji: won ? '⚡' : '⏱️',
    title: won ? 'Enzyme activated!' : 'Time’s up!',
    body: won ? 'You beat the clock and doubled your ATP for this square.' : 'No worries — enzymes miss their substrate sometimes too. You still banked a little ATP for trying.',
    atp: gained,
    actions:[{label:'Back to board', act:'closePopup'}]
  });
}

    '<p class="popup-txt">Playing as <strong>' + esc(PLAYER.name) + '</strong> · ' + PLAYER.atp + ' ATP · ' + ownedCount() + '/12 properties</p>' +
    '<div class="popup-actions">' +
      '<button class="btn" data-popact="howto">How to play</button>' +
      '<button class="btn" data-popact="switchPlayer">Switch player</button>' +
      '<button class="btn" data-popact="confirmReset">Reset my progress</button>' +
      '<button class="btn btn-primary" data-popact="closePopup">Close</button>' +
    '</div>';
}
function confirmResetBodyHTML(){
  return '<div class="popup-emoji">⚠️</div><h3 style="text-align:center">Reset your progress?</h3>' +
    '<p class="popup-txt">This clears all ATP and owned properties for <strong>' + esc(PLAYER.name) + '</strong> on this device. It can’t be undone.</p>' +
    '<div class="popup-actions"><button class="btn" data-popact="menu">Cancel</button><button class="btn btn-primary" data-popact="doReset">Yes, reset</button></div>';
}
function howtoBodyHTML(){
  return '<div class="popup-emoji">📖</div><h3 style="text-align:center">How to play</h3>' +
    '<p class="popup-txt" style="text-align:left">' +
      '• Roll the die to move around the board, or tap any property directly — you never have to wait on the dice.<br><br>' +
      '• Landing on (or tapping) a property opens its lesson: a quick hook, a guided build in the lab, then 1–2 checks for understanding. Wrong answers explain why and let you retry.<br><br>' +
      '• Finishing a lesson “buys” the property and banks ATP, the cell’s energy currency.<br><br>' +
      '• Passing or landing on GO banks ATP. Denaturation Station asks a quick protein-shape question to “refold.” Water Break and the ATP Synthase Spin corner hand out bonus ATP. Enzyme squares are timed bonus challenges.<br><br>' +
      '• Own all 3 properties in a color group for a bonus.' +
    '</p><div class="popup-actions"><button class="btn btn-primary" data-popact="closePopup">Got it</button></div>';
}
function popupHTML(){
  const p = UI.popup;
  let inner;
  if(p.mode === 'denature') inner = denatureBodyHTML();
  else if(p.mode === 'menu') inner = menuBodyHTML();
  else if(p.mode === 'confirmReset') inner = confirmResetBodyHTML();
  else if(p.mode === 'howto') inner = howtoBodyHTML();
  else if(p.mode === 'settings') inner = settingsBodyHTML();
  else inner = infoBodyHTML(p);
  const closable = p.mode !== 'denature';
  return '<div class="overlay-back" id="popupBack"><div class="overlay-card popup-card">' +
    (closable ? '<button class="overlay-close" id="closePopupBtn" aria-label="Close">✕</button>' : '') +
    inner + '</div></div>';
}

/* ============================================================
   PART 8: shared header/nav, Home screen, and the restored
   Learn Lab screen (tabs + shelf/bench + original challenge
   list + cheat sheet + learning targets), plus the Settings
   panel (question timers).
============================================================ */

    '<div class="brand"><h1 data-nav="home" style="cursor:pointer" title="Home">MonoPoly</h1><p>Build the cell, one macromolecule at a time.</p></div>' +
    '<nav class="scr-nav" aria-label="Screens">' +
      '<button class="navpill' + (active==='lab'?' active':'') + '" data-nav="lab" aria-current="' + (active==='lab') + '">🧪 Learn Lab</button>' +
      '<button class="navpill' + (active==='board'?' active':'') + '" data-nav="board" aria-current="' + (active==='board') + '">🎲 Play MonoPoly</button>' +
    '</nav>' +
    '<div class="hdr-right">' +
      '<div class="wallet" id="walletChip"><span class="ic">' + atpIcon(30) + '</span><div><div class="n" id="walletN">' + PLAYER.atp + '</div><div class="l">ATP — the cell’s energy currency</div></div></div>' +
      '<button class="iconbtn" id="settingsBtn" title="Settings">⚙️</button>' +
      '<button class="iconbtn" id="soundBtn" aria-pressed="' + SOUND_ON + '" title="Sound effects">' + (SOUND_ON ? '🔊' : '🔇') + '</button>' +
      '<button class="iconbtn" id="menuBtn" title="Menu">☰</button>' +
    '</div>' +
  '</header>';
}

/* ---------- home ---------- */
function homeHTML(){
  return '<div class="wrap">' + headerHTML('home') +
    '<div class="home-cards">' +
      '<button class="home-card" data-nav="lab"><div class="hc-ic">🧪</div><h2>Learn Lab</h2>' +
        '<p>Build monomers into polymers, run every reaction, and work through the challenge list for all four macromolecules.</p></button>' +
      '<button class="home-card" data-nav="board"><div class="hc-ic">🎲</div><h2>Play MonoPoly</h2>' +
        '<p>Roll around the board and turn what you learned into properties, ATP, and bonuses.</p></button>' +
    '</div>' +
  '</div>';
}

/* ---------- Learn Lab (restored original teaching layout) ---------- */
function labTabsHTML(){
  return '<nav class="tabs" role="tablist" aria-label="Macromolecule type">' + Object.keys(TABS).map(k =>
    '<button class="tab" role="tab" data-labtab="' + k + '" aria-selected="' + (LAB.tab === k) + '">' + tabIcon(k) + TABS[k].label + '</button>'
  ).join('') + '</nav>';
}
function labScreenHTML(){
  return '<div class="wrap">' + headerHTML('lab') +
    labTabsHTML() +
    '<div class="toast" id="labToast" aria-live="polite"></div>' +
    ledgerHTML() +
    shelfBenchHTML() +
    '<div class="lower">' +
      '<section class="panel"><h2 class="pt">What just happened</h2><div id="logWrap" aria-live="polite"></div></section>' +
      '<section class="panel challenges"><h2 class="pt">Challenges</h2><p class="prog" id="prog"></p><ul class="chal" id="chal"></ul></section>' +
      '<section class="panel facts"><h2 class="pt" id="factsTitle">Cheat sheet</h2><dl id="facts"></dl><p class="factshook" id="factshook"></p></section>' +
    '</div>' +
    '<section class="panel targets"><h2 class="pt">Learning targets</h2><ul>' +
      '<li>I can explain how monomers bond into polymers by dehydration synthesis, which releases a water molecule for every bond.</li>' +
      '<li>I can explain how polymers break back into monomers by hydrolysis, which uses up a water molecule for every bond.</li>' +
      '<li>I can identify the monomer, polymer, bond, and main job of carbohydrates, proteins, lipids, and nucleic acids.</li>' +
    '</ul></section>' +
  '</div>';
}
function switchLabTab(k){ if(TABS[k]){ LAB.tab = k; renderApp(); } }

let labToastTimer = null;
function renderLabChal(){
  const t = LAB.tab, list = CHALLENGES[t], done = PLAYER.labChallenges[t] || [];
  const prog = $('prog'); if(prog) prog.textContent = done.length + ' of ' + list.length + ' complete';
  const chal = $('chal'); if(!chal) return;
  chal.innerHTML = list.map((c,i) => {
    const isDone = done.includes(i);
    return '<li class="' + (isDone ? 'done' : '') + '"><span class="box" aria-hidden="true">' + (isDone ? '✓' : '') + '</span><span class="tx">' + esc(c.t) + '</span></li>';
  }).join('');
}
function labChallengeCheck(ev){
  const t = LAB.tab, T = LAB.tabs[t], list = CHALLENGES[t];
  if(!PLAYER.labChallenges[t]) PLAYER.labChallenges[t] = [];
  const done = PLAYER.labChallenges[t];
  const newly = [];
  list.forEach((c,i) => {
    if(!done.includes(i) && c.test(T, ev)){ done.push(i); newly.push(c.t); }
  });
  if(!newly.length) return;
  newly.forEach(() => awardATP(CFG.ATP_LAB_CHALLENGE));
  persist();
  renderLabChal();
  const el = $('labToast');
  if(el){
    const allDone = done.length === list.length;
    el.textContent = 'Challenge complete: ' + newly.join(' ') + ' +' + (CFG.ATP_LAB_CHALLENGE * newly.length) + ' ATP.' +
      (allDone ? ' That’s every ' + TABS[t].label.toLowerCase() + ' challenge!' : '');
    el.classList.add('show'); clearTimeout(labToastTimer);
    labToastTimer = setTimeout(() => el.classList.remove('show'), 5000);
  }
}

/* ---------- settings (question timers) ---------- */
function openSettings(){ openPopup({mode:'settings'}); }
function settingsBodyHTML(){
  const cur = PLAYER.timerSetting || 'off';
  const opts = [['off','Off — untimed, full ATP either way'],['relaxed','Relaxed — double time'],['standard','Standard timing']];
  return '<div class="popup-emoji">⚙️</div><h3 style="text-align:center">Settings</h3>' +
    '<p class="popup-txt">Question timers — used by Enzyme Card challenges.</p>' +
    '<div class="popup-actions" style="flex-direction:column;align-items:stretch">' +
      opts.map(([v,l]) => '<button class="btn' + (cur===v?' btn-primary':'') + '" data-timerset="' + v + '">' + esc(l) + '</button>').join('') +
    '</div>' +
    '<div class="popup-actions"><button class="btn btn-primary" data-popact="closePopup">Done</button></div>';
}
function effectiveEnzymeMs(){
  const setting = (PLAYER && PLAYER.timerSetting) || 'off';
  if(setting === 'off') return null;
  if(setting === 'relaxed') return CFG.ENZYME_MS * 2;
  return CFG.ENZYME_MS;
}

/* ============================================================
   PART 9: player session start + event wiring + init
============================================================ */
function startGame(name){
  name = (name || '').trim().slice(0,24);
  if(!name) return;
  if(!STORE.players[name]) STORE.players[name] = freshPlayer(name);
  PLAYER = normalizePlayer(STORE.players[name]);
  STORE.current = name;
  saveStore(STORE);
  UI.screen = 'home';
  renderApp();
}

document.addEventListener('click', e => {
  const t = e.target;

  const startBtn = t.closest('#startBtn');
  if(startBtn){ const inp = $('nameInput'); startGame(inp ? inp.value : ''); return; }
  const cont = t.closest('[data-continue]');
  if(cont){ startGame(cont.dataset.continue); return; }

  const soundBtn = t.closest('#soundBtn');
  if(soundBtn){ SOUND_ON = !SOUND_ON; saveSoundPref(SOUND_ON); if(SOUND_ON) ensureAudio(); renderApp(); return; }
  const menuBtn = t.closest('#menuBtn');
  if(menuBtn){ openMenu(); return; }
  const settingsBtn = t.closest('#settingsBtn');
  if(settingsBtn){ openSettings(); return; }
  const timerSet = t.closest('[data-timerset]');
  if(timerSet){ PLAYER.timerSetting = timerSet.dataset.timerset; persist(); openSettings(); return; }
  const navBtn = t.closest('[data-nav]');
  if(navBtn){
    clearInterval(challengeInterval);
    UI.overlay = null; UI.popup = null; LAB.onGoalProgress = null;
    UI.screen = navBtn.dataset.nav;
    renderApp();
    return;
  }
  const labTabBtn = t.closest('[data-labtab]');
  if(labTabBtn){ switchLabTab(labTabBtn.dataset.labtab); return; }

  const rollBtn = t.closest('#rollBtn');
  if(rollBtn){ rollDice(); return; }
  const sqBtn = t.closest('.sq[data-sqid]');
  if(sqBtn && !UI.overlay && !UI.popup && !UI.rolling){
    const sq = SQUARES.find(s => s.id === sqBtn.dataset.sqid);
    if(sq.type === 'prop') openModule(sq.id);
    else if(sq.type === 'enzyme') openChallenge(sq.id);
    else if(sq.type === 'jail') openDenature();
    else if(sq.type === 'park') openWaterBreak();
    else if(sq.type === 'bonus') openCornerBonus();
    else if(sq.type === 'go') openGoInfo();
    return;
  }

  const closeOv = t.closest('#closeOverlayBtn');
  if(closeOv){ closeOverlay(); return; }
  const backBtn = t.closest('#backToBoardBtn');
  if(backBtn){ closeOverlay(); return; }
  const giveUp = t.closest('#giveUpBtn');
  if(giveUp){ resolveChallenge(false); return; }

  const qopt = t.closest('[data-qopt]');
  if(qopt && !qopt.disabled){ quizAnswer(parseInt(qopt.dataset.qopt,10)); return; }
  const qnext = t.closest('#quizNextBtn');
  if(qnext){ quizNext(); return; }
  const danswer = t.closest('[data-danswer]');
  if(danswer && !danswer.disabled){ denatureAnswer(parseInt(danswer.dataset.danswer,10)); return; }

  const closePop = t.closest('#closePopupBtn');
  if(closePop){ closePopup(); return; }
  const popact = t.closest('[data-popact]');
  if(popact){
    const a = popact.dataset.popact;
    if(a === 'closePopup') closePopup();
    else if(a === 'menu') openMenu();
    else if(a === 'howto') openHowto();
    else if(a === 'switchPlayer') switchPlayer();
    else if(a === 'confirmReset') openConfirmReset();
    else if(a === 'doReset') doReset();
    return;
  }

  /* lab bench delegated events (shelf / bonds / tools / molecule select) — live on the Learn Lab screen or inside a board overlay */
  if(!UI.overlay && UI.screen !== 'lab') return;
  const add = t.closest('[data-add]');
  if(add){ LAB.tab === 'lipids' ? addLipid(add.dataset.add) : addLinear(add.dataset.add); return; }
  const mode = t.closest('[data-mode]');
  if(mode){
    const T = LAB.tabs.nucleic; if(T.mode === mode.dataset.mode) return;
    T.mode = mode.dataset.mode;
    const act = T.mols.find(m => m.id === T.active);
    if(act && act.units[0].s !== T.mode) T.active = null;
    renderLab(); return;
  }
  const bond = t.closest('[data-bond]');
  if(bond){ const k = bond.dataset.bond, cut = k.lastIndexOf('-'); breakBond(k.slice(0, cut), parseInt(k.slice(cut + 1), 10)); return; }
  const lb = t.closest('[data-lbond]');
  if(lb){ breakLipid(parseInt(lb.dataset.lbond, 10)); return; }
  const act = t.closest('[data-act]');
  if(act){ doLabAct(act.dataset.act); return; }
  const sel = t.closest('[data-sel]') || t.closest('[data-mol]');
  if(sel){
    const T = LAB.tabs[LAB.tab]; const id = sel.dataset.sel || sel.dataset.mol;
    if(T.active !== id){ T.active = id; renderLab(); }
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'nameInput'){ startGame(document.activeElement.value); return; }
  const lb = e.target.closest && e.target.closest('[data-lbond]');
  if(lb && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); breakLipid(parseInt(lb.dataset.lbond, 10)); }
});
function doLabAct(a){
  const t = LAB.tab, T = LAB.tabs[t];
  if(t === 'lipids'){
    if(a === 'breakall') breakAllLipid();
    if(a === 'clear'){ T.glycerol = false; T.slots = [null, null, null]; T.wasTri = false; renderLab(); }
    return;
  }
  if(a === 'new'){ T.active = null; renderLab(); return; }
  if(a === 'breakall'){ breakAllLinear(); return; }
  if(a === 'remove'){ T.mols = T.mols.filter(m => m.id !== T.active); T.active = T.mols.length ? T.mols[T.mols.length - 1].id : null; renderLab(); return; }
  if(a === 'clear'){ T.mols = []; T.active = null; renderLab(); return; }
  if(a === 'comp'){ T.complement = !T.complement; renderLab(); afterAction({type:'comp'}); }
}

/* ---------- init ---------- */
(function init(){
  if(STORE.current && STORE.players[STORE.current]){
    PLAYER = normalizePlayer(STORE.players[STORE.current]);
    UI.screen = 'home';
  }
  renderApp();
})();
})();
</script>
